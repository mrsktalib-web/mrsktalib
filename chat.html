<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with AI - SK TALIB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 22, 0.9) 0%, rgba(12, 12, 12, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.7);
        }
        html:not(.dark) .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 245, 247, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.08);
        }

        .premium-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.08) 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 4px 20px 0 rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="bg-[#f4f4f6] dark:bg-[#080808] text-gray-900 dark:text-gray-100 min-h-screen pt-24 lg:pt-20 transition-colors duration-300 antialiased flex flex-col justify-between">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0b0b0b]/90 backdrop-blur-2xl border-b border-gray-200 dark:border-amber-500/20 px-4 sm:px-6 py-3.5 shadow-md dark:shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-xs bg-gray-200 dark:bg-[#171717] hover:bg-amber-500 hover:text-gray-950 px-3.5 py-2 rounded-xl font-bold transition border border-gray-300 dark:border-amber-500/30">← Home</a>
                <a href="index.html" class="text-base sm:text-xl font-black tracking-wider text-amber-600 dark:text-amber-500 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <div class="flex items-center space-x-2.5 shrink-0">
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-10 h-10 rounded-xl bg-gray-200 dark:bg-[#171717] border border-gray-300 dark:border-amber-500/30 hover:border-amber-500/70 transition text-sm shrink-0 shadow-sm">
                    <span id="modeIcon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="max-w-2xl w-full mx-auto px-4 py-4 flex flex-col flex-1 space-y-4">
        
        <div class="text-center space-y-1">
            <h2 class="text-xl sm:text-2xl font-black tracking-tight text-gray-900 dark:text-white">SK TALIB AI Assistant</h2>
            <p class="text-xs text-amber-600 dark:text-amber-500 font-bold uppercase tracking-wider">Talk freely, friendly & naturally!</p>
        </div>

        <!-- Chat Box Window -->
        <div class="glass-card flex-1 flex flex-col rounded-3xl p-4 sm:p-5 min-h-[420px] max-h-[580px] overflow-y-auto space-y-3.5" id="chatWindow">
            <div class="flex items-start space-x-2.5">
                <div class="w-7 h-7 rounded-xl bg-amber-500 text-gray-950 font-black text-xs flex items-center justify-center shrink-0 shadow-md">AI</div>
                <div class="bg-gray-100 dark:bg-[#1a1a1a] border border-amber-500/20 p-3.5 rounded-2xl text-xs sm:text-sm text-gray-800 dark:text-gray-200 max-w-[85%] leading-relaxed shadow-sm">
                    Hello Talib bhai! Main aapka AI assistant hoon. Ab hum bilkul aaram se, friendly tarike se chat karenge. Boliye, aaj kya baat karni hai? 😊
                </div>
            </div>
        </div>

        <!-- Quick Helper Buttons -->
        <div class="flex overflow-x-auto no-scrollbar space-x-2 py-1 text-xs">
            <button onclick="sendQuickPrompt('Kaise ho?')" class="px-3.5 py-2 rounded-xl bg-white dark:bg-[#141414] border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold shrink-0 hover:border-amber-500 transition shadow-sm">👋 Kaise ho?</button>
            <button onclick="sendQuickPrompt('Apne bare me batao')" class="px-3.5 py-2 rounded-xl bg-white dark:bg-[#141414] border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold shrink-0 hover:border-amber-500 transition shadow-sm">🤖 Aap kaun ho?</button>
            <button onclick="sendQuickPrompt('Tell me about Sk Talib')" class="px-3.5 py-2 rounded-xl bg-white dark:bg-[#141414] border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold shrink-0 hover:border-amber-500 transition shadow-sm">👤 About Talib</button>
            <button onclick="sendQuickPrompt('Ek accha sa joke sunao')" class="px-3.5 py-2 rounded-xl bg-white dark:bg-[#141414] border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold shrink-0 hover:border-amber-500 transition shadow-sm">😄 Joke sunao</button>
        </div>

        <!-- Input Box -->
        <div class="glass-card p-2.5 rounded-2xl flex items-center space-x-2 shadow-lg">
            <input type="text" id="userInput" placeholder="Yahan kuch bhi type karo..." class="flex-1 bg-transparent px-3 py-2 text-xs sm:text-sm text-gray-900 dark:text-white focus:outline-none placeholder-gray-500" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-5 py-2.5 rounded-xl text-xs font-black transition shadow-md shadow-amber-500/30 shrink-0">Send</button>
        </div>
    </main>
        <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-amber-500/20 py-6 text-center px-4 mt-8">
        <p class="text-xs text-gray-500">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            modeIcon.innerText = '☀️';
        } else {
            html.classList.add('dark');
            modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        let siteData = { about: [], social: [], contact: [], products: [], movies: [], books: [] };

        async function loadSiteData() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.status !== 'unpublished') {
                        if (data.category === 'about_me') siteData.about.push(data);
                        else if (data.category === 'about_social') siteData.social.push(data);
                        else if (data.category === 'about_contact') siteData.contact.push(data);
                        else if (data.category === 'products') siteData.products.push(data);
                        else if (data.category === 'movie') siteData.movies.push(data);
                        else if (data.category === 'book') siteData.books.push(data);
                        else if (data.category === 'home') siteData.about.push(data);
                    }
                });
            } catch (err) {
                console.error("Error loading knowledge base:", err);
            }
        }
        loadSiteData();

        window.sendQuickPrompt = function(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        window.sendMessage = async function() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const chatWindow = document.getElementById('chatWindow');
            
            // Append User Message
            chatWindow.innerHTML += `
                <div class="flex items-start justify-end space-x-2.5">
                    <div class="bg-amber-500 text-gray-950 p-3.5 rounded-2xl text-xs sm:text-sm max-w-[85%] leading-relaxed font-semibold shadow-md">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;
            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Typing Indicator
            const typingId = 'typing_' + Date.now();
            chatWindow.innerHTML += `
                <div id="${typingId}" class="flex items-start space-x-2.5">
                    <div class="w-7 h-7 rounded-xl bg-amber-500 text-gray-950 font-black text-xs flex items-center justify-center shrink-0 shadow-md">AI</div>
                    <div class="bg-gray-100 dark:bg-[#1a1a1a] border border-amber-500/20 p-3.5 rounded-2xl text-xs text-gray-500 dark:text-gray-400 italic shadow-sm">
                        Soch raha hoon...
                    </div>
                </div>
            `;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Generate Natural Conversational Response
            setTimeout(() => {
                document.getElementById(typingId).remove();
                let reply = getNaturalAIResponse(message);
                
                chatWindow.innerHTML += `
                    <div class="flex items-start space-x-2.5">
                        <div class="w-7 h-7 rounded-xl bg-amber-500 text-gray-950 font-black text-xs flex items-center justify-center shrink-0 shadow-md">AI</div>
                        <div class="bg-gray-100 dark:bg-[#1a1a1a] border border-amber-500/20 p-3.5 rounded-2xl text-xs sm:text-sm text-gray-800 dark:text-gray-200 max-w-[85%] leading-relaxed shadow-sm whitespace-pre-line">
                            ${reply}
                        </div>
                    </div>
                `;
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, 500);
        }

        function getNaturalAIResponse(query) {
            const q = query.toLowerCase();
            
            // Greetings & Casual Talk
            if (q.includes('kaise ho') || q.includes('kya haal') || q.includes('how are you') || q.includes('kemon acho')) {
                return "Main ekdum fit and fine hoon! Aap bataiye, aapka din kaisa chal raha hai?";
            }
            if (q.includes('name') || q.includes('naam') || q.includes('aap kaun') || q.includes('who are you')) {
                return "Arre main SK Talib ka apna personal AI assistant hoon! Aapke website par koi bhi visitors aayega, toh main unse baat karunga aur unhe guidance dunga.";
            }
            if (q.includes('joke') || q.includes('chutkula') || q.includes('hasao')) {
                return "Suniye phir: Boss ne employee se pucha — 'Tum office late kyun aaye?' Employee bola — 'Sir, raste par ek board laga tha jiss par likha tha: Aage School hai, dheere chalein!' 😄 Kaisa laga?";
            }
            if (q.includes('ha batao') || q.includes('batao') || q.includes('aur sunao')) {
                name = "Arey sunao phir! Aap apni website mrsktalib.in ko aur kaisa behtareen banana chahte ho? Koi naya feature add karna hai kya?";
            }

            // About Talib
            if (q.includes('talib') || q.includes('about') || q.includes('owner') || q.includes('creator')) {
                if (siteData.about.length > 0) {
                    let res = "SK Talib ke baare mein yeh sab recorded hai:\n";
                    siteData.about.forEach(item => {
                        if (item.titles?.en) res += `• ${item.titles.en}: `;
                        if (item.descriptions?.en) res += `${item.descriptions.en}\n`;
                    });
                    return res;
                }
                return "SK Talib ek talented developer aur creator hain jo apni shandaar website mrsktalib.in aur digital projects par kaam kar rahe hain!";
            }

            // Education
            if (q.includes('education') || q.includes('study') || q.includes('college') || q.includes('padhai')) {
                return "SK Talib ne Maulana Azad National Urdu University (MANUU) Polytechnic Cuttack Campus se Diploma in Engineering ki padhai ki hai.";
            }

            // Products & Shopping
            if (q.includes('product') || q.includes('item') || q.includes('buy') || q.includes('kareed')) {
                if (siteData.products.length > 0) {
                    let res = "Yeh hain hamare available products:\n";
                    siteData.products.forEach(p => {
                        res += `• ${p.titles?.en || 'Product'} (${p.price || ''}) - ${p.descriptions?.en || ''}\n`;
                    });
                    return res;
                }
                return "Aap hamare Products page par jakar saari latest items dekh sakte hain!";
            }

            // Contact & Social
            if (q.includes('contact') || q.includes('social') || q.includes('telegram') || q.includes('instagram') || q.includes('email') || q.includes('number')) {
                let res = "Aap SK Talib se yahan connect ho sakte hain:\n";
                if (siteData.social.length > 0) {
                    siteData.social.forEach(s => { res += `• ${s.titles?.en}: ${s.redirectLink || ''}\n`; });
                }
                if (siteData.contact.length > 0) {
                    siteData.contact.forEach(c => { res += `• ${c.titles?.en}: ${c.redirectLink || c.descriptions?.en || ''}\n`; });
                }
                if (res.trim() === "Aap SK Talib se yahan connect ho sakte hain:") {
                    return "Aap About page par jakar saare social links aur contact details dekh sakte hain.";
                }
                return res;
            }

            // Smart Dynamic Friendly Reply for anything else
            return `Baat toh sahi hai! Aapne ekdum interesting baat boli. Aap chahe toh website ke baare mein puch sakte hain, ya aise hi kuch aur discuss kar sakte hain. Main sun raha hoon, boliye!`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
