<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Personal Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen pt-28 sm:pt-32 transition-colors duration-300 antialiased">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center shrink-0">
                <a href="index.html" class="text-base sm:text-xl font-bold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center space-x-1 text-xs font-semibold">
                <a href="index.html" class="text-red-600 dark:text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition">Home</a>
                <a href="about.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">About</a>
                <a href="movie.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Movie</a>
                <a href="products.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Products</a>
                <a href="book.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Book</a>
                <a href="chat.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Chat with AI</a>
            </nav>

            <!-- Right Controls -->
            <div class="flex items-center space-x-2.5 shrink-0">
                <div class="relative" id="langDropdownContainer">
                    <button type="button" onclick="toggleLangMenu()" class="flex items-center space-x-1.5 bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-800 rounded-xl px-2.5 py-1.5 text-xs font-medium hover:border-red-500 transition">
                        <span>🌐</span>
                        <span id="currentLangLabel">English</span>
                        <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="langMenu" class="hidden absolute right-0 mt-2 w-36 bg-white dark:bg-[#171717] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl overflow-hidden z-50">
                        <button type="button" onclick="selectLanguage('en', 'English')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#262626] transition flex items-center justify-between">
                            <span>English</span>
                            <span id="check_en" class="text-red-500 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectLanguage('roman_hi', 'Roman Hindi')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#262626] border-t border-gray-100 dark:border-gray-800 transition flex items-center justify-between">
                            <span>Roman Hindi</span>
                            <span id="check_roman_hi" class="text-red-500 font-bold hidden">✓</span>
                        </button>
                    </div>
                </div>

                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-8 h-8 rounded-xl bg-gray-100 dark:bg-[#171717] border border-gray-200 dark:border-gray-800 hover:bg-gray-200 dark:hover:bg-[#262626] transition" title="Toggle Theme">
                    <span id="modeIcon" class="text-xs">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Horizontal Nav Bar -->
    <div class="fixed top-[57px] left-0 w-full z-40 flex lg:hidden overflow-x-auto no-scrollbar space-x-4 px-4 py-2.5 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="text-red-600 dark:text-red-500">Home</a>
        <a href="about.html" class="text-gray-600 dark:text-gray-400">About</a>
        <a href="movie.html" class="text-gray-600 dark:text-gray-400">Movie</a>
        <a href="products.html" class="text-gray-600 dark:text-gray-400">Products</a>
        <a href="book.html" class="text-gray-600 dark:text-gray-400">Book</a>
        <a href="chat.html" class="text-gray-600 dark:text-gray-400">Chat with AI</a>
    </div>

    <!-- Main Content Container -->
    <main class="max-w-2xl mx-auto px-4 py-6">
        <h2 class="text-lg font-bold mb-4 text-gray-900 dark:text-white">Latest Feed</h2>
        <div id="homeFeedContainer" class="space-y-4">
            <p class="text-xs text-gray-500 text-center py-8">Loading feed...</p>
        </div>
    </main>

    <!-- Floating Admin Button (+) -->
    <button onclick="openAdminModal()" class="fixed bottom-6 right-6 w-12 h-12 bg-red-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl font-bold hover:bg-red-700 transition z-50">+</button>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#171717] p-6 rounded-3xl w-full max-w-sm border border-gray-200 dark:border-gray-800 shadow-2xl">
            <h3 class="text-sm font-bold mb-3 text-gray-900 dark:text-white">Admin Access</h3>
            <input type="password" id="adminPassInput" placeholder="Enter Admin Password" class="w-full p-3 bg-gray-100 dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs mb-3 focus:outline-none focus:border-red-500">
            <div class="flex space-x-2">
                <button onclick="verifyAdmin()" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-red-700 transition">Login</button>
                <button onclick="closeAdminModal()" class="flex-1 bg-gray-200 dark:bg-[#262626] text-gray-800 dark:text-gray-200 py-2.5 rounded-xl text-xs font-bold transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-8 text-center px-4 mt-12 mb-16">
        <p class="text-xs text-gray-500 dark:text-gray-400">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = localStorage.getItem('site_lang') || 'en';

        window.toggleLangMenu = function() {
            document.getElementById('langMenu').classList.toggle('hidden');
        }

        window.selectLanguage = function(lang, label) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            document.getElementById('currentLangLabel').innerText = label;
            document.getElementById('check_en').classList.toggle('hidden', lang !== 'en');
            document.getElementById('check_roman_hi').classList.toggle('hidden', lang !== 'roman_hi');
            document.getElementById('langMenu').classList.add('hidden');
            loadHomeFeed();
        }

        document.addEventListener('click', function(e) {
            const container = document.getElementById('langDropdownContainer');
            if (container && !container.contains(e.target)) {
                document.getElementById('langMenu').classList.add('hidden');
            }
        });

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            modeIcon.innerText = '☀️';
        } else {
            html.classList.add('dark');
            modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.openAdminModal = function() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        window.closeAdminModal = function() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        window.verifyAdmin = function() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'SKTALIB@9037') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Incorrect Password!');
            }
        }

        async function loadHomeFeed() {
            const container = document.getElementById('homeFeedContainer');
            if (!container) return;
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let posts = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    // STRICTLY load ONLY 'home' category posts
                    if (data.category === 'home' && data.status !== 'unpublished') {
                        posts.push({ id: doc.id, ...data });
                    }
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (posts.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">No posts in Home feed yet.</p>`;
                    return;
                }

                container.innerHTML = "";
                posts.forEach(post => {
                    const title = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : (post.titles?.en || '');
                    const desc = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : (post.descriptions?.en || '');
                    
                    let mediaHtml = "";
                    if (post.mediaType === 'video_link' && post.media) {
                        mediaHtml = `<div class="aspect-video w-full mb-3"><iframe src="${post.media}" class="w-full h-full rounded-2xl" allowfullscreen></iframe></div>`;
                    } else if (post.media) {
                        mediaHtml = `<img src="${post.media}" class="w-full max-h-[450px] object-cover rounded-2xl mb-3 border border-gray-200 dark:border-gray-800" loading="lazy">`;
                    }

                    container.innerHTML += `
                        <div class="bg-gray-50 dark:bg-[#171717] p-5 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm mb-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] text-gray-400">${post.dateFormatted || ''}</span>
                            </div>
                            ${title ? `<h3 class="text-sm font-bold text-gray-900 dark:text-white mb-2">${title}</h3>` : ''}
                            ${mediaHtml}
                            ${desc ? `<p class="text-xs text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-line">${desc}</p>` : ''}
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Home feed error:", err);
            }
        }

        loadHomeFeed();
    </script>
</body>
                </html>
