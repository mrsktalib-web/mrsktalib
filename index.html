<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Personal Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Hide all Google Translate default banners & UI completely */
        .goog-te-banner-frame { display: none !important; }
        .goog-tooltip { display: none !important; }
        body { top: 0 !important; position: static !important; }
        #google_translate_element { display: none !important; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    
    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-[#0f0f0f]/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <!-- Logo (Fixed on single line) -->
            <div class="flex items-center">
                <a href="index.html" class="text-lg sm:text-xl font-bold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-sm mx-6">
                <input type="text" id="searchInput" placeholder="Search videos, movies, books..." class="w-full bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-800 px-4 py-1.5 rounded-l-full focus:outline-none text-xs">
                <button class="bg-gray-200 dark:bg-[#262626] px-4 rounded-r-full border border-l-0 border-gray-300 dark:border-gray-800 text-xs">🔍</button>
            </div>

            <!-- Nav Links & Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3 text-sm font-medium">
                <a href="index.html" class="text-red-600 hover:text-red-500 hidden lg:block text-xs font-semibold">Home</a>
                <a href="product.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold">Products</a>
                <a href="book.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold">Books</a>
                <a href="movies.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold">Movies</a>
                <a href="about.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold">About</a>

                <!-- Custom Premium Translate Dropdown -->
                <div class="relative">
                    <select id="customLangSelect" onchange="triggerGoogleTranslate(this.value)" class="bg-gray-100 dark:bg-[#1f2937] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-gray-700 text-xs rounded-xl px-3 py-2 focus:outline-none cursor-pointer font-medium shadow-sm transition hover:border-red-500">
                        <option value="en">🌐 English</option>
                        <option value="hi-Latn">Roman Hindi</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="ur">اردو (Urdu)</option>
                        <option value="or">ଓଡ଼ିଆ (Odia)</option>
                        <option value="bn">বাংলা (Bengali)</option>
                        <option value="ar">العربية (Arabic)</option>
                        <option value="es">Español (Spanish)</option>
                        <option value="fr">Français (French)</option>
                        <option value="zh-CN">中文 (Chinese)</option>
                    </select>
                </div>

                <!-- Hidden Google Translate Element to process translation engine -->
                <div id="google_translate_element"></div>

                <!-- Premium Glowing Glass Day/Night Toggle Button -->
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-gray-100 dark:bg-[#1f2937] border border-gray-200 dark:border-gray-700 hover:scale-110 active:scale-95 transition-all shadow-sm" title="Toggle Theme">
                    <span id="modeIcon" class="text-sm">🌙</span>
                </button>

                <!-- Admin Link -->
                <a href="admin.html" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-semibold transition shadow-md whitespace-nowrap">Admin</a>
            </div>
        </div>
    </header>

    <!-- Mobile Nav Bar Links -->
    <div class="flex md:hidden overflow-x-auto space-x-4 px-4 py-2 bg-gray-50 dark:bg-[#151515] border-b border-gray-200 dark:border-gray-800 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="text-red-600">Home</a>
        <a href="product.html" class="text-gray-600 dark:text-gray-400">Products</a>
        <a href="book.html" class="text-gray-600 dark:text-gray-400">Books</a>
        <a href="movies.html" class="text-gray-600 dark:text-gray-400">Movies</a>
        <a href="about.html" class="text-gray-600 dark:text-gray-400">About</a>
    </div>

    <!-- Main Content Feed -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-6 border-b border-gray-200 dark:border-gray-800 pb-3">
            <h2 class="text-xl font-bold">Latest Feed & Uploads</h2>
        </div>
        
        <div id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="p-6 rounded-xl border border-gray-200 dark:border-gray-800 animate-pulse bg-gray-50 dark:bg-[#1a1a1a]">
                <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-3/4 mb-4"></div>
                <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-1/2 mb-6"></div>
                <div class="h-10 bg-gray-200 dark:bg-gray-800 rounded"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Google Translate Script & Custom Trigger -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi,ur,or,bn,ar,es,fr,zh-CN',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function triggerGoogleTranslate(langCode) {
            var tbl = ['/auto/' + langCode, '/en/' + langCode];
            document.cookie = 'googtrans=' + tbl[1] + ';path=/;domain=' + document.domain;
            document.cookie = 'googtrans=' + tbl[1] + ';path=/';
            location.reload();
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mrsktalib-4ab8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Premium Smooth Day/Night Toggle Function
        function toggleDarkMode() {
            const html = document.documentElement;
            const modeIcon = document.getElementById('modeIcon');
            const btn = document.getElementById('themeToggleBtn');
            
            btn.style.transform = 'rotate(360deg) scale(1.1)';
            setTimeout(() => { btn.style.transform = 'rotate(0deg) scale(1)'; }, 300);

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }
        window.toggleDarkMode = toggleDarkMode;

        // Check saved theme preference on load
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('modeIcon').innerText = '☀️';
        } else {
            document.documentElement.classList.add('light');
            document.getElementById('modeIcon').innerText = '🌙';
        }

        // Load Posts from Firestore Database
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if(querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12 border border-dashed border-gray-300 dark:border-gray-800 rounded-xl">
                            <p class="text-sm text-gray-500 mb-3">No content published yet.</p>
                            <a href="admin.html" class="text-xs text-red-600 underline font-semibold">Open Admin Panel to add posts</a>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    container.innerHTML += `
                        <div class="bg-white dark:bg-[#161616] border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
                            <div class="p-5">
                                <span class="text-[10px] tracking-wider uppercase bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 font-bold px-2.5 py-1 rounded-md inline-block mb-3">${post.category || 'Feed'}</span>
                                <h3 class="font-semibold text-lg mb-4">${post.title}</h3>
                                <a href="${post.media}" target="_blank" class="w-full block text-center text-xs font-semibold bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg transition">Open / Watch</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-red-500 col-span-full">Failed to load content. Check database connection.</p>`;
            }
        }

        loadPosts();
    </script>
</body>
    </html>
