<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Personal Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-black dark:text-white min-h-screen transition-colors duration-200 font-sans">
    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-[#0f0f0f]/90 backdrop-blur border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-xl font-bold tracking-wider text-red-600">SK TALIB</a>
        </div>
        <div class="flex-1 max-w-xl mx-4 hidden md:flex">
            <input type="text" id="searchInput" placeholder="Search videos, movies, books..." class="w-full bg-gray-100 dark:bg-[#222] border border-gray-300 dark:border-gray-700 px-4 py-2 rounded-l-full focus:outline-none text-sm">
            <button class="bg-gray-200 dark:bg-[#333] px-6 rounded-r-full border border-l-0 border-gray-300 dark:border-gray-700 text-sm">🔍</button>
        </div>
        <div class="flex items-center space-x-4">
            <a href="product.html" class="text-sm hover:text-red-500 hidden sm:block">Products</a>
            <a href="book.html" class="text-sm hover:text-red-500 hidden sm:block">Book</a>
            <a href="about.html" class="text-sm hover:text-red-500 hidden sm:block">About</a>
            <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800">🌙</button>
            <a href="admin.html" class="text-xs bg-red-600 text-white px-3 py-1.5 rounded-full font-semibold">Admin</a>
        </div>
    </header>

    <!-- Main Content Feed -->
    <main class="p-6 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Latest Feed & Uploads</h2>
        </div>
        <div id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <p class="text-gray-500">Loading content...</p>
        </div>
    </main>

    <!-- Firebase Reader Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mrsktalib-4ab8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
        window.toggleDarkMode = toggleDarkMode;

        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if(querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-500 col-span-full">No posts uploaded yet. Use <a href="admin.html" class="text-red-500 underline">Admin Panel</a> to add posts.</p>`;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    container.innerHTML += `
                        <div class="bg-gray-100 dark:bg-[#1f1f1f] rounded-xl overflow-hidden border border-gray-200 dark:border-gray-800 shadow-md">
                            <div class="p-4">
                                <h3 class="font-bold text-lg mb-2">${post.title}</h3>
                                <p class="text-xs text-red-500 uppercase font-semibold mb-3">${post.category}</p>
                                <a href="${post.media}" target="_blank" class="text-sm bg-red-600 text-white px-4 py-2 rounded-lg inline-block hover:bg-red-700">Watch / Open Link</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-red-500 col-span-full">Error loading posts. Make sure Firestore test mode is active.</p>`;
            }
        }

        loadPosts();
    </script>
</body>
          </html>
