<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Personal Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
        /* Fix for dark mode select dropdown */
        select option { background-color: #171717; color: #ffffff; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen pt-20 transition-colors duration-300 antialiased">
    
    <!-- Fixed Top Navigation Bar (Does not scroll away) -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-sm border-b border-gray-100 dark:border-gray-800 px-4 sm:px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <!-- Logo -->
            <div class="flex items-center">
                <a href="index.html" class="text-lg sm:text-xl font-bold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-sm mx-6">
                <input type="text" id="searchInput" placeholder="Search content..." class="w-full bg-gray-50 dark:bg-[#171717] border border-gray-100 dark:border-gray-800 px-4 py-2 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-xs dark:text-white placeholder-gray-400 transition-all">
                <button class="bg-gray-100 dark:bg-[#262626] px-4 rounded-r-xl border border-l-0 border-gray-100 dark:border-gray-800 text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-[#333333] transition-all">🔍</button>
            </div>

            <!-- Nav Links & Controls -->
            <div class="flex items-center space-x-1 sm:space-x-2 text-sm font-medium">
                <a href="index.html" class="text-red-600 dark:text-red-500 hidden lg:block text-xs font-semibold px-3 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition-all" data-i18n="nav_home">Home</a>
                <a href="about.html" class="text-gray-600 dark:text-gray-300 hidden lg:block text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition-all" data-i18n="nav_about">About</a>
                <a href="movie.html" class="text-gray-600 dark:text-gray-300 hidden lg:block text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition-all" data-i18n="nav_movie">Movie</a>
                <a href="products.html" class="text-gray-600 dark:text-gray-300 hidden lg:block text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition-all" data-i18n="nav_products">Products</a>
                <a href="book.html" class="text-gray-600 dark:text-gray-300 hidden lg:block text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition-all" data-i18n="nav_book">Book</a>
                <a href="chat.html" class="text-gray-600 dark:text-gray-300 hidden lg:block text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition-all" data-i18n="nav_chat">Chat with AI ✨</a>

                <!-- Translate Globe Logo + Dropdown (Dark Mode Fixed) -->
                <div class="flex items-center bg-gray-50 dark:bg-[#171717] border border-gray-100 dark:border-gray-800 rounded-xl px-3 py-1.5 shadow-inner">
                    <span class="text-xs mr-1.5">🌐</span>
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-transparent text-gray-800 dark:text-gray-200 text-xs focus:outline-none cursor-pointer font-medium appearance-none">
                        <option value="en">English</option>
                        <option value="roman_hi">Roman Hindi</option>
                    </select>
                    <svg class="w-3 h-3 text-gray-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>

                <!-- Premium Day/Night Toggle Button -->
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-gray-50 dark:bg-[#171717] border border-gray-100 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-[#262626] hover:scale-105 active:scale-95 transition-all shadow-sm" title="Toggle Theme">
                    <span id="modeIcon" class="text-sm">🌙</span>
                </button>

                <!-- Secure Ad Post Button (Password Modal) -->
                <button onclick="openPasswordModal()" class="flex items-center space-x-1.5 bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-white text-xs font-bold shadow-md transition hover:scale-105 active:scale-95 whitespace-nowrap" title="Admin Ad Post">
                    <span>+</span>
                    <span>Ad Post</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Password Modal Box -->
    <div id="passwordModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 transition-opacity duration-300">
        <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-gray-700 transform transition-transform scale-95 duration-300">
            <h3 class="text-lg font-bold text-red-500 mb-4 text-center">Admin Password</h3>
            <input type="password" id="modalPassword" placeholder="Enter secret password" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white mb-3 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
            <div class="flex space-x-3">
                <button onclick="verifyPassword()" class="flex-1 bg-red-600 hover:bg-red-700 py-3 rounded-xl text-xs font-bold text-white transition-all shadow">Submit</button>
                <button onclick="closePasswordModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl text-xs font-bold text-white transition-all">Cancel</button>
            </div>
            <p id="modalError" class="text-red-400 text-xs text-center mt-3 min-h-[16px]"></p>
        </div>
    </div>

    <!-- Mobile Nav Bar Links -->
    <div class="fixed top-[57px] left-0 w-full z-40 flex md:hidden overflow-x-auto space-x-4 px-4 py-3 bg-white dark:bg-[#0f0f0f] border-b border-gray-100 dark:border-gray-800 text-xs font-semibold whitespace-nowrap shadow-sm scrollbar-hide">
        <a href="index.html" class="text-red-600 dark:text-red-500" data-i18n="nav_home">Home</a>
        <a href="about.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_about">About</a>
        <a href="movie.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_movie">Movie</a>
        <a href="products.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_products">Products</a>
        <a href="book.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_book">Book</a>
        <a href="chat.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_chat">Chat with AI</a>
    </div>

    <!-- Main Content Feed -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 mt-4">
        <div class="flex justify-between items-center mb-8 border-b border-gray-100 dark:border-gray-800 pb-4">
            <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white" data-i18n="latest_feed">Latest Uploads</h2>
            <button onclick="openPasswordModal()" class="text-xs text-red-600 dark:text-red-500 hover:underline font-medium flex items-center lg:hidden">
                + Ad Post
            </button>
        </div>
        
        <div id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
            <!-- Post Skeleton Loader (while loading) -->
            <div class="bg-gray-50 dark:bg-[#171717] p-6 rounded-3xl border border-gray-100 dark:border-gray-800 animate-pulse space-y-4">
                <div class="h-48 bg-gray-200 dark:bg-[#262626] rounded-2xl w-full"></div>
                <div class="flex justify-between items-center">
                    <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-1/4"></div>
                    <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-1/6"></div>
                </div>
                <div class="h-6 bg-gray-200 dark:bg-[#262626] rounded-lg w-3/4"></div>
                <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-full"></div>
                <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-2/3"></div>
            </div>
             <div class="bg-gray-50 dark:bg-[#171717] p-6 rounded-3xl border border-gray-100 dark:border-gray-800 animate-pulse space-y-4 hidden sm:block">
                <div class="h-48 bg-gray-200 dark:bg-[#262626] rounded-2xl w-full"></div>
                <div class="flex justify-between items-center">
                    <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-1/4"></div>
                    <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-1/6"></div>
                </div>
                <div class="h-6 bg-gray-200 dark:bg-[#262626] rounded-lg w-3/4"></div>
                <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-full"></div>
                 <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-2/3"></div>
            </div>
             <div class="bg-gray-50 dark:bg-[#171717] p-6 rounded-3xl border border-gray-100 dark:border-gray-800 animate-pulse space-y-4 hidden md:block">
                <div class="h-48 bg-gray-200 dark:bg-[#262626] rounded-2xl w-full"></div>
                <div class="flex justify-between items-center">
                    <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-1/4"></div>
                    <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-1/6"></div>
                </div>
                <div class="h-6 bg-gray-200 dark:bg-[#262626] rounded-lg w-3/4"></div>
                <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-full"></div>
                 <div class="h-4 bg-gray-200 dark:bg-[#262626] rounded-md w-2/3"></div>
            </div>
        </div>

        <!-- Empty State Message -->
        <div id="emptyState" class="hidden col-span-full text-center py-16 border-2 border-dashed border-gray-200 dark:border-gray-800 rounded-3xl bg-gray-50 dark:bg-[#171717]">
            <p class="text-base text-gray-500 dark:text-gray-400 mb-5 font-medium" data-i18n="no_posts">No posts yet.</p>
             <button onclick="openPasswordModal()" class="inline-block text-sm bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg active:scale-95" data-i18n="admin_link">Create First Post</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-100 dark:border-gray-800 py-12 text-center px-4 mt-10 bg-gray-50 dark:bg-[#171717]">
        <p class="text-xs text-gray-500 dark:text-gray-400">&copy; 2026 SK TALIB. All rights reserved.</p>
         <p class="text-[10px] text-gray-400 dark:text-gray-600 mt-2">Crafted with passion by SK TALIB & Gemini AI</p>
                                                                                                                                                                                                                            </footer>
               <!-- Scripts -->
    <script type="module">
        // Firebase SDK Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Configuration (Securely embedded)
        const firebaseConfig = {
            projectId: "mrsktalib-4ab8e"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Translation Dictionary
        const translations = {
            en: { 
                nav_home: "Home", nav_about: "About", nav_movie: "Movie", nav_products: "Products", nav_book: "Book", nav_chat: "Chat with AI ✨",
                latest_feed: "Latest Uploads", no_posts: "No content published yet.", admin_link: "Create First Post" 
            },
            roman_hi: { 
                nav_home: "Home", nav_about: "About", nav_movie: "Movie", nav_products: "Products", nav_book: "Book", nav_chat: "Chat with AI ✨",
                latest_feed: "Latest Uploads", no_posts: "Abhi tak koi content publish nahi hua hai.", admin_link: "Pehla Post Banayein" 
            }
        };

        // Language Management
        let currentLang = localStorage.getItem('site_lang') || 'en';
        document.getElementById('langSelect').value = currentLang;

        window.changeLanguage = function(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            applyTranslations();
            loadPosts(); // Reload posts to show translated titles/descriptions
        }

        function applyTranslations() {
            const t = translations[currentLang] || translations.en;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
            // Update placeholder for search input
            document.getElementById('searchInput').placeholder = currentLang === 'en' ? "Search content..." : "Content khojein...";
        }

        // Theme (Dark/Light Mode) Management
        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
            modeIcon.innerText = '☀️';
        } else {
            html.classList.remove('dark');
            modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Password Modal Logic (for Admin Access)
        window.openPasswordModal = function() {
            document.getElementById('passwordModal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('passwordModal').firstElementChild.classList.remove('scale-95');
                 document.getElementById('modalPassword').focus();
            }, 10);
        }

        window.closePasswordModal = function() {
            document.getElementById('passwordModal').firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                document.getElementById('passwordModal').classList.add('hidden');
            }, 300);
        }

        window.verifyPassword = function() {
            const pass = document.getElementById('modalPassword').value.trim();
            const errorMsg = document.getElementById('modalError');
            if (pass === 'SKTALIB@9037') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else {
                errorMsg.innerText = 'Incorrect Password! Please try again.';
                 document.getElementById('modalPassword').value = '';
            }
        }
        
        // Allow 'Enter' key to submit password modal
        document.getElementById('modalPassword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { verifyPassword(); }
        });

        // Firestore Data Loading & Rendering
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');
            
            try {
                const postsRef = collection(db, "posts");
                // Query only published posts, ordered by creation date (newest first)
                const q = query(postsRef, where("status", "==", "published"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if(querySnapshot.empty) {
                    container.innerHTML = ""; // Clear skeletons
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                container.innerHTML = ""; // Clear skeletons

                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    
                    // Fallback to 'en' or raw title if translation is missing
                    const title = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : post.title;
                    const desc = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : '';

                    let mediaContent = "";
                    if(post.mediaType === 'video_link') {
                        const rawUrl = post.media;
                        let embedUrl = rawUrl;
                        // Handle Video Embed URLs (YouTube, Instagram, Facebook)
                        if(rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be')) {
                            let ytId = rawUrl.includes('v=') ? rawUrl.split('v=')[1].split('&')[0] : rawUrl.split('/').pop();
                            embedUrl = `https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1`;
                        } else if(rawUrl.includes('instagram.com')) {
                            embedUrl = rawUrl.endsWith('/') ? rawUrl + 'embed/' : rawUrl + '/embed/';
                        }
                        mediaContent = `<div class="relative aspect-video w-full bg-black rounded-2xl overflow-hidden border border-gray-100 dark:border-gray-800"><iframe class="w-full h-full" src="${embedUrl}" frameborder="0" allowfullscreen loading="lazy"></iframe></div>`;
                    } else if(post.media) {
                        mediaContent = `<img src="${post.media}" class="w-full h-48 object-cover rounded-2xl border border-gray-100 dark:border-gray-800" alt="${post.title}" loading="lazy">`;
                    }

                    // Post Card HTML Template
                    container.innerHTML += `
                        <article class="bg-white dark:bg-[#171717] p-6 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm hover:shadow-lg transition-shadow duration-300 flex flex-col">
                            ${mediaContent}
                            <div class="pt-5 flex-grow">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-[10px] tracking-wider uppercase bg-red-100 dark:bg-red-950/60 text-red-700 dark:text-red-400 font-bold px-3 py-1 rounded-full">${post.category || 'Feed'}</span>
                                    ${post.price ? `<span class="text-sm font-bold text-green-600 dark:text-green-500">${post.price}</span>` : ''}
                                </div>
                                <h3 class="font-semibold text-lg leading-snug mb-3 text-gray-900 dark:text-white hover:text-red-600 dark:hover:text-red-500 transition-colors">${title}</h3>
                                ${desc ? `<p class="text-xs text-gray-600 dark:text-gray-400 line-clamp-3 leading-relaxed">${desc}</p>` : ''}
                            </div>
                        </article>
                    `;
                });
            } catch (err) {
                console.error("Error loading posts:", err);
                container.innerHTML = `<p class="text-red-500 col-span-full text-center p-10 bg-red-50 dark:bg-red-950/30 rounded-3xl">Failed to load content. Please check your connection or Firebase configuration.</p>`;
            }
        }

        // Initialize
        applyTranslations();
        loadPosts();

    </script>
</body>
</html>
