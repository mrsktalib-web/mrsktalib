<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Personal Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    
    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-[#0f0f0f]/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <!-- Logo (Fixed on Single Line) -->
            <div class="flex items-center">
                <a href="index.html" class="text-lg sm:text-xl font-bold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-sm mx-6">
                <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-800 px-4 py-1.5 rounded-l-full focus:outline-none text-xs">
                <button class="bg-gray-200 dark:bg-[#262626] px-4 rounded-r-full border border-l-0 border-gray-300 dark:border-gray-800 text-xs">🔍</button>
            </div>

            <!-- Nav Links & Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3 text-sm font-medium">
                <a href="index.html" class="text-red-600 hover:text-red-500 hidden lg:block text-xs font-semibold" data-i18n="nav_home">Home</a>
                <a href="product.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold" data-i18n="nav_products">Products</a>
                <a href="book.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold" data-i18n="nav_books">Books</a>
                <a href="movies.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold" data-i18n="nav_movies">Movies</a>
                <a href="about.html" class="hover:text-red-500 hidden lg:block text-xs font-semibold" data-i18n="nav_about">About</a>

                <!-- Custom 6-Language Dropdown -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 dark:bg-[#1f2937] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-gray-700 text-xs rounded-xl px-3 py-2 focus:outline-none cursor-pointer font-medium shadow-sm transition hover:border-red-500">
                    <option value="en">English</option>
                    <option value="roman_hi">Roman Hindi</option>
                    <option value="hi">हिंदी (Hindi)</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="or">ଓଡ଼ିଆ (Odia)</option>
                </select>

                <!-- Premium Day/Night Toggle Button -->
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-gray-100 dark:bg-[#1f2937] border border-gray-200 dark:border-gray-700 hover:scale-110 active:scale-95 transition-all shadow-sm" title="Toggle Theme">
                    <span id="modeIcon" class="text-sm">🌙</span>
                </button>

                <!-- YouTube Style '+' Admin Icon -->
                <a href="admin.html" class="flex items-center justify-center w-9 h-9 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-lg shadow-md transition hover:scale-105" title="Creator Studio / Add Post">+</a>
            </div>
        </div>
    </header>

    <!-- Mobile Nav Bar Links -->
    <div class="flex md:hidden overflow-x-auto space-x-4 px-4 py-2 bg-gray-50 dark:bg-[#151515] border-b border-gray-200 dark:border-gray-800 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="text-red-600" data-i18n="nav_home">Home</a>
        <a href="product.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_products">Products</a>
        <a href="book.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_books">Books</a>
        <a href="movies.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_movies">Movies</a>
        <a href="about.html" class="text-gray-600 dark:text-gray-400" data-i18n="nav_about">About</a>
    </div>

    <!-- Main Content Feed -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-6 border-b border-gray-200 dark:border-gray-800 pb-3">
            <h2 class="text-xl font-bold" data-i18n="latest_feed">Latest Feed & Uploads</h2>
        </div>
        
        <div id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="p-6 rounded-xl border border-gray-200 dark:border-gray-800 animate-pulse bg-gray-50 dark:bg-[#1a1a1a]">
                <div class="h-4 bg-gray-200 dark:bg-gray-800 rounded w-3/4 mb-4"></div>
                <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-1/2 mb-6"></div>
                <div class="h-10 bg-gray-200 dark:bg-gray-800 rounded"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mrsktalib-4ab8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Multi-Language Dictionary
        const translations = {
            en: { nav_home: "Home", nav_products: "Products", nav_books: "Books", nav_movies: "Movies", nav_about: "About", latest_feed: "Latest Feed & Uploads", no_posts: "No content published yet.", admin_link: "Click '+' icon above to add posts", open_btn: "Open / Watch" },
            roman_hi: { nav_home: "Home", nav_products: "Products", nav_books: "Books", nav_movies: "Movies", nav_about: "About", latest_feed: "Latest Feed & Uploads", no_posts: "Abhi tak koi content publish nahi hua hai.", admin_link: "Post add karne ke liye upar '+' icon dabayein", open_btn: "Dekhein / Open Karein" },
            hi: { nav_home: "होम", nav_products: "उत्पाद", nav_books: "किताबें", nav_movies: "फ़िल्में", nav_about: "हमारे बारे में", latest_feed: "नवीनतम फ़ीड और अपलोड", no_posts: "अभी तक कोई सामग्री प्रकाशित नहीं हुई है.", admin_link: "पोस्ट जोड़ने के लिए ऊपर '+' आइकॉन दबाएं", open_btn: "देखें / खोलें" },
            ur: { nav_home: "ہوم", nav_products: "مصنوعات", nav_books: "کتابیں", nav_movies: "فلمیں", nav_about: "ہمارے بارے میں", latest_feed: "تازہ ترین فیڈ اور اپ لوڈز", no_posts: "ابھی تک کوئی مواد شائع نہیں ہوا۔", admin_link: "پوسٹس شامل کرنے کے لیے اوپر '+' آئیکن پر کلک کریں", open_btn: "دیکھیں / کھولیں" },
            bn: { nav_home: "হোম", nav_products: "পণ্য", nav_books: "বই", nav_movies: "চলচ্চিত্র", nav_about: "সম্পর্কিত", latest_feed: "সর্বশেষ ফিড এবং আপলোড", no_posts: "এখনও কোনো কন্টেন্ট প্রকাশিত হয়নি।", admin_link: "পোস্ট যোগ করতে উপরে '+' আইকনে ক্লিক করুন", open_btn: "দেখুন / খুলুন" },
            or: { nav_home: "ହୋମ୍", nav_products: "ଉତ୍ପାଦ", nav_books: "ବହି", nav_movies: "ଚଳଚ୍ଚିତ୍ର", nav_about: "ବିଷୟରେ", latest_feed: "ସର୍ବଶେଷ ଫିଡ୍ ଏବଂ ଅପଲୋଡ୍", no_posts: "ବର୍ତ୍ତମାନ ପର୍ଯ୍ୟନ୍ତ କୌଣସି କଣ୍ଟେଣ୍ଟ୍ ପ୍ରକାଶିତ ହୋଇନାହିଁ।", admin_link: "ପୋଷ୍ଟ ଯୋଡିବା ପାଇଁ ଉପରେ '+' ଆଇକନ୍ କ୍ଲିକ୍ କରନ୍ତୁ", open_btn: "ଖୋଲନ୍ତୁ / ଦେଖନ୍ତୁ" }
        };

        let currentLang = localStorage.getItem('site_lang') || 'en';
        document.getElementById('langSelect').value = currentLang;

        window.changeLanguage = function(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            applyTranslations();
            loadPosts();
        }

        function applyTranslations() {
            const t = translations[currentLang] || translations.en;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
        }

        // Day/Night Mode Toggle Function
        function toggleDarkMode() {
            const html = document.documentElement;
            const modeIcon = document.getElementById('modeIcon');
            const btn = document.getElementById('themeToggleBtn');
            
            btn.style.transform = 'rotate(360deg) scale(1.1)';
            setTimeout(() => { btn.style.transform = 'rotate(0deg) scale(1);' }, 300);

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }
        window.toggleDarkMode = toggleDarkMode;

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('modeIcon').innerText = '☀️';
        } else {
            document.documentElement.classList.add('dark', false); // default light
            document.getElementById('modeIcon').innerText = '🌙';
        }

        // Load Posts from Firestore Database with Multi-Language Support
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            const t = translations[currentLang] || translations.en;
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if(querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12 border border-dashed border-gray-300 dark:border-gray-800 rounded-xl">
                            <p class="text-sm text-gray-500 mb-3">${t.no_posts}</p>
                            <a href="admin.html" class="text-xs text-red-600 underline font-semibold">${t.admin_link}</a>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    if(post.status === 'unpublished') return; // Skip unpublished items

                    let title = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : post.title;
                    let desc = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : '';

                    container.innerHTML += `
                        <div class="bg-white dark:bg-[#161616] border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
                            ${post.media ? `<img src="${post.media}" class="w-full h-48 object-cover" alt="Banner">` : ''}
                            <div class="p-5">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] tracking-wider uppercase bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 font-bold px-2.5 py-1 rounded-md">${post.category || 'Feed'}</span>
                                    ${post.price ? `<span class="text-xs font-bold text-green-500">${post.price}</span>` : ''}
                                </div>
                                <h3 class="font-semibold text-lg mb-2">${title}</h3>
                                ${desc ? `<p class="text-xs text-gray-500 dark:text-gray-400 mb-4 line-clamp-2">${desc}</p>` : ''}
                                <a href="${post.media}" target="_blank" class="w-full block text-center text-xs font-semibold bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg transition">${t.open_btn}</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-red-500 col-span-full">Failed to load content. Check database connection.</p>`;
            }
        }

        applyTranslations();
        loadPosts();
    </script>
</body>
                    </html>
