<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies & TV Shows - SK TALIB</title>
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 22, 0.9) 0%, rgba(12, 12, 12, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.7);
        }
        html:not(.dark) .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 245, 247, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-[#f4f4f6] dark:bg-[#080808] text-gray-900 dark:text-gray-100 min-h-screen pt-24 lg:pt-20 transition-colors duration-300 antialiased">
    
    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0b0b0b]/90 backdrop-blur-2xl border-b border-gray-200 dark:border-amber-500/25 px-4 sm:px-6 py-3.5 shadow-md">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-black tracking-wider text-amber-600 dark:text-amber-500">SK <span class="text-gray-900 dark:text-white">TALIB</span></h1>
            <div class="flex items-center space-x-2">
                <a href="index.html" class="px-3 py-2 rounded-xl bg-gray-200 dark:bg-[#171717] border border-gray-300 dark:border-amber-500/30 text-xs font-bold hover:border-amber-500 transition">Home</a>
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="w-10 h-10 rounded-xl bg-gray-200 dark:bg-[#171717] border border-gray-300 dark:border-amber-500/30 hover:border-amber-500 transition text-sm flex items-center justify-center shadow-sm">
                    <span id="modeIcon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">
        <!-- Page Title & Category Filter Tabs -->
        <div class="text-center space-y-3">
            <h2 class="text-xl sm:text-2xl font-black tracking-tight text-gray-900 dark:text-white">Movies & TV Shows</h2>
            <div class="flex justify-center space-x-2">
                <button onclick="filterMovieType('all')" id="mTab_all" class="px-4 py-1.5 rounded-xl bg-amber-500 text-gray-950 font-bold text-xs transition">All</button>
                <button onclick="filterMovieType('Movie')" id="mTab_Movie" class="px-4 py-1.5 rounded-xl bg-gray-200 dark:bg-black/60 border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold text-xs transition">Movies</button>
                <button onclick="filterMovieType('TV Show')" id="mTab_TVShow" class="px-4 py-1.5 rounded-xl bg-gray-200 dark:bg-black/60 border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold text-xs transition">TV Shows</button>
            </div>
        </div>

        <!-- Movies Container -->
        <div id="moviesContainer" class="space-y-6">
            <div class="glass-card p-8 rounded-3xl text-center text-gray-500 text-xs">Loading items...</div>
        </div>
    </main>

    <footer class="border-t border-gray-200 dark:border-amber-500/20 py-8 text-center px-4 mt-16 mb-16">
        <p class="text-xs text-gray-500">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');
        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            modeIcon.innerText = '☀️';
        } else {
            html.classList.add('dark');
            modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        let allMovies = [];
        let currentMovieFilter = 'all';

        window.filterMovieType = function(type) {
            currentMovieFilter = type;
            ['all', 'Movie', 'TVShow'].forEach(t => {
                const btn = document.getElementById(`mTab_${t}`);
                if (btn) {
                    btn.className = "px-4 py-1.5 rounded-xl bg-gray-200 dark:bg-black/60 border border-gray-300 dark:border-amber-500/30 text-gray-700 dark:text-gray-300 font-bold text-xs transition";
                }
            });
            const activeBtn = document.getElementById(`mTab_${type}`);
            if (activeBtn) {
                activeBtn.className = "px-4 py-1.5 rounded-xl bg-amber-500 text-gray-950 font-bold text-xs transition";
            }
            renderMovies();
        }

        async function loadMovies() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                allMovies = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.status !== 'unpublished' && (data.category === 'movie' || data.category === 'movies')) {
                        allMovies.push(data);
                    }
                });
                allMovies.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderMovies();
            } catch (err) {
                console.error("Error loading movies:", err);
                document.getElementById('moviesContainer').innerHTML = `<div class="glass-card p-6 rounded-3xl text-center text-xs text-red-500">Failed to load content.</div>`;
            }
        }

        function renderMovies() {
            const container = document.getElementById('moviesContainer');
            let filtered = allMovies;

            if (currentMovieFilter !== 'all') {
                filtered = allMovies.filter(m => (m.contentType || 'Movie').toLowerCase() === currentMovieFilter.toLowerCase());
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="glass-card p-6 rounded-3xl text-center text-xs text-gray-500">No movies or TV shows added yet.</div>`;
                return;
            }

            container.innerHTML = "";
            filtered.forEach(item => {
                const title = item.titles?.en || 'Untitled';
                const type = item.contentType || 'Movie';
                const media = item.media || '';
                const desc = item.descriptions?.en || '';
                const videoUrl = item.mediaType === 'video_link' ? item.media : (item.videoUrl || '');

                let mediaHtml = '';
                if (videoUrl && videoUrl.includes('embed')) {
                    mediaHtml = `<div class="w-full aspect-video rounded-2xl overflow-hidden bg-black"><iframe src="${videoUrl}" class="w-full h-full border-0" allowfullscreen></iframe></div>`;
                } else if (media && media.startsWith('data:image')) {
                    mediaHtml = `<img src="${media}" class="w-full rounded-2xl object-cover max-h-[450px] border border-amber-500/20">`;
                }

                container.innerHTML += `
                    <div class="glass-card p-5 sm:p-6 rounded-3xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base sm:text-lg font-black text-gray-900 dark:text-white tracking-wide">${title}</h3>
                            <span class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-600 dark:text-amber-400 font-bold text-[10px] uppercase">${type}</span>
                        </div>
                        ${mediaHtml}
                        ${desc ? `<p class="text-xs sm:text-sm text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-line">${desc}</p>` : ''}
                    </div>
                `;
            });
        }

        loadMovies();
    </script>
</body>
</html>
