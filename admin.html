<body class="min-h-screen py-8 px-4 antialiased flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full mt-6">
        <!-- Login Box -->
        <div id="loginBox" class="glass-card p-8 rounded-3xl space-y-6 border border-amber-500/40">

        </div>

        <!-- Dashboard Box -->
        <div id="dashboardBox" style="display: none;" class="space-y-6">
            <div class="flex justify-between items-center bg-black/60 p-4 rounded-2xl border border-amber-500/30">

            <!-- Publish / Edit Form Card -->

                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Select Category</label>
                        <select id="postCategory" onchange="updateFormFields()" class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">

                            <option value="about_contact">About - Contact Option</option>
                            <option value="movie">Movie / TV Show</option>

                            <option value="book">Book</option>

                        </select>

                    <!-- Movie Type Selector -->
                    <div id="fieldContentType" style="display: none;">
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Content Type</label>
                        <select id="contentType" class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">

                    </div>

                    <!-- Image File Upload -->

                    <button onclick="filterAdminCategory('all')" id="tab_all" class="px-3.5 py-2 rounded-xl bg-amber-500 text-gray-950 font-bold shrink-0 transition">All</button>
                    <button onclick="filterAdminCategory('home')" id="tab_home" class="px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition">Home</button>
                    <button onclick="filterAdminCategory('about_me')" id="tab_about_me" class="px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition">About Me</button>
                    <button onclick="filterAdminCategory('about_social')" id="tab_about_social" class="px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition">Social</button>

                    <button onclick="filterAdminCategory('products')" id="tab_products" class="px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition">Products</button>
                    <button onclick="filterAdminCategory('book')" id="tab_book" class="px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition">Book</button>
                    <button onclick="filterAdminCategory('gallery')" id="tab_gallery" class="px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition">Gallery</button>

        </div>
    </div>
        <footer class="py-6 text-center text-xs text-gray-600">
        &copy; 2026 SK TALIB. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginBox = document.getElementById('loginBox');
        const dashboardBox = document.getElementById('dashboardBox');
        let allAdminPosts = [];
        let currentFilter = 'all';

        if (sessionStorage.getItem('talibAdminAuth') === 'true') {
            loginBox.style.display = 'none';
            dashboardBox.style.display = 'block';
            fetchAdminPosts();
        }

        window.verifyLogin = function() {
            const val = document.getElementById('passwordInput').value.trim();
            if (val === "SKTALIB@9037") {
                sessionStorage.setItem('talibAdminAuth', 'true');
                loginBox.style.display = 'none';
                dashboardBox.style.display = 'block';
                fetchAdminPosts();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        window.doLogout = function() {
            sessionStorage.removeItem('talibAdminAuth');
            dashboardBox.style.display = 'none';
            loginBox.style.display = 'block';
            document.getElementById('passwordInput').value = "";
        }

        function formatPlayableUrl(url) {
            if (!url) return "";
            if (url.includes("youtube.com/watch?v=")) {
                const id = url.split("v=")[1].split("&")[0];
                return `https://www.youtube.com/embed/${id}`;
            }
            if (url.includes("youtu.be/")) {
                const id = url.split("youtu.be/")[1].split("?")[0];
                return `https://www.youtube.com/embed/${id}`;
            }
            return url;
        }

        window.updateFormFields = function() {
            const cat = document.getElementById('postCategory').value;

            const fType = document.getElementById('fieldContentType');
            const fIntro = document.getElementById('fieldIntro');
            const fImg = document.getElementById('fieldImageUpload');
            const fVid = document.getElementById('fieldVideoLink');
            const fLink = document.getElementById('fieldRedirectLink');
            const fPrice = document.getElementById('fieldPrice');
            const fSoon = document.getElementById('fieldComingSoon');
            const fDesc = document.getElementById('fieldDesc');

            const lTitle = document.getElementById('labelTitle');
            const lImage = document.getElementById('labelImage');
            const lVideo = document.getElementById('labelVideo');
            const lLink = document.getElementById('labelLink');
            const lDesc = document.getElementById('labelDesc');

            fType.style.display = 'none';
            fIntro.style.display = 'none';
            fImg.style.display = 'none';
            fVid.style.display = 'none';
            fLink.style.display = 'none';
            fPrice.style.display = 'none';
            fSoon.style.display = 'none';
            fDesc.style.display = 'none';

            if (cat === 'home') {
                lTitle.innerText = "Title";
                lImage.innerText = "Upload Image (Optional)";
                lVideo.innerText = "Video Link (Optional - Plays inside site)";
                lDesc.innerText = "Description";
                fImg.style.display = 'block';
                fVid.style.display = 'block';
                fDesc.style.display = 'block';
            } 
            else if (cat === 'about_me') {
                lTitle.innerText = "Title (Mota Heading - e.g. Personal Information)";
                lDesc.innerText = "Description / Line-by-line Details";
                fIntro.style.display = 'block';
                fDesc.style.display = 'block';
            } 
            else if (cat === 'about_social') {
                lTitle.innerText = "Social Platform Name (e.g. Instagram)";
                lImage.innerText = "Upload Logo Image";
                lLink.innerText = "Profile Link";
                fImg.style.display = 'block';
                fLink.style.display = 'block';
            } 
            else if (cat === 'about_contact') {
                lTitle.innerText = "Contact Title (e.g. Telegram, Gmail)";
                lImage.innerText = "Upload Icon Image";
                lLink.innerText = "Contact Link / Email";
                fImg.style.display = 'block';
                fLink.style.display = 'block';
            } 
            else if (cat === 'movie') {
                lTitle.innerText = "Banner / Title";
                lImage.innerText = "Upload Banner Image";
                lVideo.innerText = "Video Link";
                fType.style.display = 'block';
                fImg.style.display = 'block';
                fVid.style.display = 'block';
            } 
            else if (cat === 'products') {
                lTitle.innerText = "Product Title";
                lImage.innerText = "Upload Product Image";
                lLink.innerText = "Product Link (Optional)";
                lVid.innerText = "Video Link (Optional)";
                lDesc.innerText = "Description";
                fImg.style.display = 'block';
                fLink.style.display = 'block';
                fVid.style.display = 'block';
                fPrice.style.display = 'block';
                fDesc.style.display = 'block';
            } 
            else if (cat === 'book') {
                lTitle.innerText = "Book Title";
                lImage.innerText = "Upload Book Cover Photo";
                lLink.innerText = "Book Link (Optional)";
                lDesc.innerText = "Description";
                fImg.style.display = 'block';
                fLink.style.display = 'block';
                fSoon.style.display = 'flex';
                fDesc.style.display = 'block';
            } 
            else if (cat === 'gallery') {
                lTitle.innerText = "Photo Title";
                lImage.innerText = "Upload Gallery Image";
                lLink.innerText = "Video / External Link (Optional)";

                fImg.style.display = 'block';
                fLink.style.display = 'block';
                fDesc.style.display = 'block';
            }
        }
        updateFormFields();

        function compressAndConvertImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 900;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
                reader.onerror = err => reject(err);
            });
        }

        window.savePost = async function() {
            const btn = document.getElementById('publishBtn');
            const editId = document.getElementById('editPostId').value;
            const cat = document.getElementById('postCategory').value;
            const contentType = document.getElementById('contentType').value;
            const title = document.getElementById('postTitle').value.trim();
            const intro = document.getElementById('postIntro').value.trim();
            const imageFile = document.getElementById('imageInput').files[0];
            const videoRaw = document.getElementById('postVideo').value.trim();
            const redirectLink = document.getElementById('postLink').value.trim();
            let price = document.getElementById('postPrice').value.trim();
            const comingSoon = document.getElementById('comingSoonCheck').checked;
            const desc = document.getElementById('postDesc').value.trim();

            if (cat === 'book' && comingSoon) {
                price = "Coming Soon";
            }

            btn.innerText = editId ? "Updating..." : "Publishing...";
            btn.disabled = true;

            try {
                let mediaData = document.getElementById('existingMedia')?.value || "";
                let mediaType = "image";

                if (imageFile) {
                    mediaData = await compressAndConvertImage(imageFile);
                    mediaType = "image";
                } else if (videoRaw) {
                    mediaData = formatPlayableUrl(videoRaw);
                    mediaType = "video_link";
                } else if (cat === 'gallery' && redirectLink && !mediaData) {
                    mediaData = formatPlayableUrl(redirectLink);
                    mediaType = "video_link";
                }

                const postData = {
                    category: cat,
                    contentType: cat === 'movie' ? contentType : '',
                    titles: { en: title },
                    intro: cat === 'about_me' ? intro : '',
                    descriptions: { en: desc },
                    media: mediaData,
                    mediaType: mediaType,
                    redirectLink: redirectLink,
                    price: price,
                    status: 'published'
                };

                if (editId) {
                    await updateDoc(doc(db, "posts", editId), postData);
                    alert("Updated successfully!");
                } else {
                    postData.createdAt = Date.now();
                    await addDoc(collection(db, "posts"), postData);
                    alert("Published successfully!");
                }

                resetForm();
                fetchAdminPosts();
            } catch (err) {
                console.error("Save error:", err);
                alert("Error while saving post.");
            } finally {
                btn.innerText = "Publish Now";
                btn.disabled = false;
            }
        }

        window.resetForm = function() {
            document.getElementById('editPostId').value = "";
            document.getElementById('formHeading').innerText = "Publish New Item";
            document.getElementById('publishBtn').innerText = "Publish Now";
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('postTitle').value = "";
            document.getElementById('postIntro').value = "";
            document.getElementById('imageInput').value = "";
            document.getElementById('postVideo').value = "";
            document.getElementById('postLink').value = "";
            document.getElementById('postPrice').value = "";
            document.getElementById('postDesc').value = "";
            if(document.getElementById('existingMedia')) document.getElementById('existingMedia').remove();
        }

        window.editPost = function(id) {
            const item = allAdminPosts.find(p => p.id === id);
            if (!item) return;

            document.getElementById('editPostId').value = item.id;
            document.getElementById('formHeading').innerText = "Edit Post / Item";
            document.getElementById('publishBtn').innerText = "Update Post";
            document.getElementById('cancelEditBtn').style.display = 'block';

            document.getElementById('postCategory').value = item.category || 'home';
            updateFormFields();

            if (item.category === 'movie' && item.contentType) {
                document.getElementById('contentType').value = item.contentType;
            }
            document.getElementById('postTitle').value = item.titles?.en || '';
            document.getElementById('postIntro').value = item.intro || '';
            document.getElementById('postVideo').value = item.videoUrl || (item.mediaType === 'video_link' ? item.media : '');
            document.getElementById('postLink').value = item.redirectLink || item.link || '';
            document.getElementById('postPrice').value = item.price || '';
            document.getElementById('postDesc').value = item.descriptions?.en || '';

            if (item.media && item.media.startsWith('data:image')) {
                let hiddenInput = document.getElementById('existingMedia');
                if (!hiddenInput) {
                    hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.id = 'existingMedia';
                    document.body.appendChild(hiddenInput);
                }
                hiddenInput.value = item.media;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.filterAdminCategory = function(cat) {
            currentFilter = cat;
            document.querySelectorAll('[id^="tab_"]').forEach(btn => {
                btn.className = "px-3.5 py-2 rounded-xl bg-black/60 border border-amber-500/30 text-gray-300 font-bold shrink-0 transition";
            });
            document.getElementById(`tab_${cat}`).className = "px-3.5 py-2 rounded-xl bg-amber-500 text-gray-950 font-bold shrink-0 transition";
            renderAdminPosts();
        }

        async function fetchAdminPosts() {
            const container = document.getElementById('postsList');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                allAdminPosts = [];
                querySnapshot.forEach(d => {
                    allAdminPosts.push({ id: d.id, ...d.data() });
                });
                renderAdminPosts();
            } catch (err) {
                console.error("Error loading posts:", err);
                container.innerHTML = `<p class="text-xs text-red-500 text-center py-4">Error loading posts.</p>`;
            }
        }

        function renderAdminPosts() {
            const container = document.getElementById('postsList');
            let filtered = allAdminPosts;

            if (currentFilter !== 'all') {
                filtered = allAdminPosts.filter(p => {
                    const c = (p.category || '').toLowerCase();
                    if (currentFilter === 'about_me') return c === 'about_me' || c === 'about';
                    if (currentFilter === 'about_social') return c === 'about_social' || c === 'social';
                    if (currentFilter === 'about_contact') return c === 'about_contact' || c === 'contact';
                    return c === currentFilter;
                });
            }

            // Sorting: About Me = Oldest first, Others = Newest first
            filtered.sort((a, b) => {
                const cA = (a.category || '').toLowerCase();
                if (currentFilter === 'about_me' || (currentFilter === 'all' && (cA === 'about_me' || cA === 'about'))) {
                    return (a.createdAt || 0) - (b.createdAt || 0);
                }
                return (b.createdAt || 0) - (a.createdAt || 0);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No posts found in this category.</p>`;
                return;
            }

            container.innerHTML = "";
            filtered.forEach(item => {
                const titleText = item.titles?.en || 'Untitled';
                const categoryName = item.category || 'general';
                const badge = item.contentType ? ` • ${item.contentType}` : '';
                container.innerHTML += `
                    <div class="flex justify-between items-center p-3 rounded-2xl bg-black/60 border border-amber-500/20 text-xs">
                        <div class="truncate pr-2">
                            <span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-md font-bold uppercase text-[10px]">${categoryName}${badge}</span>
                            <p class="font-bold text-white mt-1 truncate max-w-[200px] sm:max-w-xs">${titleText}</p>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="editPost('${item.id}')" class="bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white px-3 py-1.5 rounded-xl font-bold transition">Edit</button>
                            <button onclick="removePost('${item.id}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl font-bold transition">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        window.removePost = async function(id) {
            if (confirm("Delete this post?")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("Deleted successfully!");
                    fetchAdminPosts();
                } catch (err) {
                    console.error("Delete error:", err);
                    alert("Failed to delete.");
                }
            }
        }
    </script>
</body>
    </html>
