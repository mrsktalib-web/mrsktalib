<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SK TALIB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen pt-24 transition-colors duration-300 antialiased">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-xs bg-gray-100 dark:bg-[#171717] hover:bg-gray-200 dark:hover:bg-[#262626] px-3 py-1.5 rounded-xl font-medium transition">← Back to Site</a>
                <h1 class="text-base sm:text-lg font-bold text-red-600">Admin Dashboard ⚡</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="logoutAdmin()" class="text-xs bg-red-600/10 text-red-600 dark:text-red-400 px-3.5 py-1.5 rounded-xl font-bold hover:bg-red-600 hover:text-white transition">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Admin Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
                <!-- Category Selector Tabs (Website Sections + All 6 About Sections Separately) -->
        <div class="flex overflow-x-auto no-scrollbar space-x-2 pb-4 mb-6 border-b border-gray-200 dark:border-gray-800">
            <button onclick="switchTab('home')" id="tab_home" class="px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white transition whitespace-nowrap">Home / Feed</button>
            <button onclick="switchTab('movie')" id="tab_movie" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Movies</button>
            <button onclick="switchTab('products')" id="tab_products" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Products</button>
            <button onclick="switchTab('book')" id="tab_book" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Books</button>
            <button onclick="switchTab('about_personal')" id="tab_about_personal" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">👤 About: Personal</button>
            <button onclick="switchTab('about_education')" id="tab_about_education" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">🎓 About: Education</button>
            <button onclick="switchTab('about_gallery')" id="tab_about_gallery" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">🖼️ About: Gallery</button>
            <button onclick="switchTab('about_feelings')" id="tab_about_feelings" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">💭 About: Feeling Moment</button>
            <button onclick="switchTab('about_social')" id="tab_about_social" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">🌐 About: Social Media</button>
            <button onclick="switchTab('about_contact')" id="tab_about_contact" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">📞 About: Contact</button>
        </div>

        <!-- Content Form Box -->
        <div class="bg-gray-50 dark:bg-[#171717] p-6 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm mb-10">
            <h3 id="formTitle" class="text-base font-bold mb-4 text-gray-900 dark:text-white">Add New Post</h3>
            
            <form id="contentForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingId" value="">

                <!-- Bilingual Titles (English & Roman Hindi) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="titleFieldsContainer">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">Title / Label (English)</label>
                        <input type="text" id="titleEn" placeholder="e.g. Current Location or Title" class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">Title / Label (Roman Hindi)</label>
                        <input type="text" id="titleHi" placeholder="Roman hindi mein title..." class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <!-- Price / Badge Field -->
                <div id="priceFieldContainer" class="hidden">
                    <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">Price / Status Badge</label>
                    <input type="text" id="postPrice" placeholder="e.g. ₹499 or Coming Soon" class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500">
                </div>

                <!-- Media Section -->
                <div id="mediaFieldsContainer" class="space-y-3">
                    <div id="mediaTypeToggleBox" class="flex items-center space-x-4">
                        <label class="text-xs font-semibold text-gray-600 dark:text-gray-400">Media Type:</label>
                        <label class="text-xs flex items-center space-x-1 cursor-pointer"><input type="radio" name="mediaType" value="image" checked onchange="toggleMediaType()"> <span>Image (Local/Compressed)</span></label>
                        <label class="text-xs flex items-center space-x-1 cursor-pointer"><input type="radio" name="mediaType" value="video_link" onchange="toggleMediaType()"> <span>Video Link</span></label>
                    </div>

                    <div id="imageUploadBox">
                        <input type="file" id="imageFile" accept="image/*" onchange="compressAndConvertImage(this)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer">
                        <input type="hidden" id="imageBase64">
                        <div id="imagePreviewContainer" class="mt-2 hidden">
                            <img id="imagePreview" class="w-24 h-24 object-cover rounded-xl border border-gray-200 dark:border-gray-800">
                        </div>
                    </div>

                    <div id="videoLinkBox" class="hidden">
                        <input type="url" id="videoLinkInput" placeholder="Paste YouTube, Instagram or video URL" class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <!-- Redirect / Social Link -->
                <div id="linkFieldContainer" class="hidden">
                    <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">Redirect / Social / Affiliate Link</label>
                    <input type="url" id="postRedirectLink" placeholder="https://instagram.com/... or telegram link" class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500">
                </div>

                <!-- Bilingual Descriptions / Values -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="descFieldsContainer">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">Value / Description (English)</label>
                        <textarea id="descEn" rows="3" class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500 resize-none" placeholder="Enter details or description here..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">Value / Description (Roman Hindi)</label>
                        <textarea id="descHi" rows="3" class="w-full p-3 bg-white dark:bg-[#0f0f0f] border border-gray-200 dark:border-gray-800 rounded-xl text-xs focus:outline-none focus:border-red-500 resize-none" placeholder="Roman hindi mein details likhein..."></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex items-center space-x-3 pt-2">
                    <button type="submit" id="submitBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl text-xs font-bold transition shadow">Publish Item</button>
                    <button type="button" onclick="resetForm()" id="cancelEditBtn" class="hidden bg-gray-200 dark:bg-[#262626] text-gray-800 dark:text-gray-200 px-5 py-3 rounded-xl text-xs font-bold transition">Cancel Edit</button>
                </div>
            </form>
        </div>
                <!-- Manager List -->
        <div class="space-y-4">
            <h3 class="text-base font-bold text-gray-900 dark:text-white">Manage Uploads (<span id="totalPostsCount">0</span>)</h3>
            <div id="adminPostsList" class="space-y-3">
                <p class="text-xs text-gray-500">Loading your items...</p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (sessionStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'index.html';
        }

        window.logoutAdmin = function() {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        }

        let currentCategory = 'home';
        let allAdminPosts = [];

        window.switchTab = function(category) {
            currentCategory = category;
            ['home', 'movie', 'products', 'book', 'about_personal', 'about_education', 'about_gallery', 'about_feelings', 'about_social', 'about_contact'].forEach(cat => {
                const btn = document.getElementById(`tab_${cat}`);
                if (btn) {
                    if (cat === category) {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white transition whitespace-nowrap";
                    } else {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap";
                    }
                }
            });

            const priceContainer = document.getElementById('priceFieldContainer');
            const linkContainer = document.getElementById('linkFieldContainer');
            const mediaTypeToggleBox = document.getElementById('mediaTypeToggleBox');
            const videoLinkBox = document.getElementById('videoLinkBox');
            const imageUploadBox = document.getElementById('imageUploadBox');

            if (category === 'products' || category === 'book') {
                priceContainer.classList.remove('hidden');
                linkContainer.classList.remove('hidden');
                mediaTypeToggleBox.classList.add('hidden');
                videoLinkBox.classList.add('hidden');
                imageUploadBox.classList.remove('hidden');
                document.querySelector('input[name="mediaType"][value="image"]').checked = true;
                if (category === 'book') document.getElementById('postPrice').value = 'Coming Soon';
            } else if (category === 'about_gallery' || category === 'about_feelings') {
                priceContainer.classList.add('hidden');
                linkContainer.classList.add('hidden');
                mediaTypeToggleBox.classList.add('hidden');
                videoLinkBox.classList.add('hidden');
                imageUploadBox.classList.remove('hidden');
                document.querySelector('input[name="mediaType"][value="image"]').checked = true;
            } else if (category === 'about_social' || category === 'about_contact') {
                priceContainer.classList.add('hidden');
                linkContainer.classList.remove('hidden'); // Show link for social/contact
                mediaTypeToggleBox.classList.add('hidden');
                videoLinkBox.classList.add('hidden');
                imageUploadBox.classList.remove('hidden'); // Optional logo/icon
                document.querySelector('input[name="mediaType"][value="image"]').checked = true;
            } else if (category === 'about_personal' || category === 'about_education') {
                priceContainer.classList.add('hidden');
                linkContainer.classList.add('hidden');
                mediaTypeToggleBox.classList.add('hidden');
                videoLinkBox.classList.add('hidden');
                imageUploadBox.classList.add('hidden'); // No image needed for text info cards
            } else {
                priceContainer.classList.add('hidden');
                linkContainer.classList.add('hidden');
                mediaTypeToggleBox.classList.remove('hidden');
                toggleMediaType();
            }
            resetForm();
            renderAdminPosts();
        }

        window.toggleMediaType = function() {
            const type = document.querySelector('input[name="mediaType"]:checked').value;
            if (type === 'image') {
                document.getElementById('imageUploadBox').classList.remove('hidden');
                document.getElementById('videoLinkBox').classList.add('hidden');
            } else {
                document.getElementById('imageUploadBox').classList.add('hidden');
                document.getElementById('videoLinkBox').classList.remove('hidden');
            }
        }
                window.compressAndConvertImage = function(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64String = canvas.toDataURL('image/jpeg', 0.7);
                    
                    document.getElementById('imageBase64').value = base64String;
                    const preview = document.getElementById('imagePreview');
                    preview.src = base64String;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const editingId = document.getElementById('editingId').value;
            
            const titleEn = document.getElementById('titleEn').value.trim();
            const titleHi = document.getElementById('titleHi').value.trim();
            const descEn = document.getElementById('descEn').value.trim();
            const descHi = document.getElementById('descHi').value.trim();
            const price = document.getElementById('postPrice').value.trim();
            const redirectLink = document.getElementById('postRedirectLink').value.trim();

            const mediaType = document.querySelector('input[name="mediaType"]:checked').value;
            let mediaVal = "";
            if (!document.getElementById('imageUploadBox').classList.contains('hidden')) {
                mediaVal = document.getElementById('imageBase64').value;
            } else if (!document.getElementById('videoLinkBox').classList.contains('hidden')) {
                mediaVal = document.getElementById('videoLinkInput').value.trim();
            }

            const postData = {
                category: currentCategory,
                titles: { en: titleEn, roman_hi: titleHi },
                descriptions: { en: descEn, roman_hi: descHi },
                price: price,
                redirectLink: redirectLink,
                mediaType: mediaType,
                media: mediaVal,
                status: 'published',
                createdAt: Date.now(),
                dateFormatted: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' at ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Saving...";
            submitBtn.disabled = true;

            try {
                if (editingId) {
                    await updateDoc(doc(db, "posts", editingId), postData);
                    alert("Item updated successfully!");
                } else {
                    await addDoc(collection(db, "posts"), postData);
                    alert("Item published successfully!");
                }
                resetForm();
                loadAdminPosts();
            } catch (err) {
                console.error("Save error:", err);
                alert("Failed to save. Check Firebase connection.");
                submitBtn.innerText = "Publish Item";
                submitBtn.disabled = false;
            }
        }

        window.resetForm = function() {
            document.getElementById('contentForm').reset();
            document.getElementById('editingId').value = '';
            document.getElementById('imageBase64').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('submitBtn').innerText = "Publish Item";
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('formTitle').innerText = `Add New Item (${currentCategory.toUpperCase()})`;
            if(currentCategory === 'book') document.getElementById('postPrice').value = 'Coming Soon';
        }

        window.editPost = function(id) {
            const post = allAdminPosts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('editingId').value = post.id;
            document.getElementById('titleEn').value = post.titles?.en || '';
            document.getElementById('titleHi').value = post.titles?.roman_hi || '';
            document.getElementById('descEn').value = post.descriptions?.en || '';
            document.getElementById('descHi').value = post.descriptions?.roman_hi || '';
            document.getElementById('postPrice').value = post.price || '';
            document.getElementById('postRedirectLink').value = post.redirectLink || '';

            if (post.media) {
                document.getElementById('imageBase64').value = post.media;
                document.getElementById('imagePreview').src = post.media;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }

            document.getElementById('submitBtn').innerText = "Update Item";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('formTitle').innerText = `Edit Item (${currentCategory.toUpperCase()})`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.toggleStatus = async function(id, currentStatus) {
            const newStatus = currentStatus === 'unpublished' ? 'published' : 'unpublished';
            try {
                await updateDoc(doc(db, "posts", id), { status: newStatus });
                loadAdminPosts();
            } catch (err) {
                alert("Failed to update status.");
            }
        }

        window.deletePost = async function(id) {
            if (confirm("Are you sure you want to delete this item?")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    loadAdminPosts();
                } catch (err) {
                    alert("Failed to delete.");
                }
            }
        }

        function renderAdminPosts() {
            const container = document.getElementById('adminPostsList');
            const filtered = allAdminPosts.filter(p => p.category === currentCategory);
            document.getElementById('totalPostsCount').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 py-4 text-center border border-dashed border-gray-200 dark:border-gray-800 rounded-2xl">No items found in ${currentCategory.toUpperCase()}.</p>`;
                return;
            }

            container.innerHTML = "";
            filtered.forEach(post => {
                const title = post.titles?.en || post.titles?.roman_hi || 'Untitled Item';
                const isPub = post.status !== 'unpublished';
                const timeStr = post.dateFormatted || 'Recently';

                container.innerHTML += `
                    <div class="bg-white dark:bg-[#171717] p-4 rounded-2xl border border-gray-200 dark:border-gray-800 flex items-center justify-between gap-4">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            ${post.media ? `<img src="${post.media}" class="w-12 h-12 object-cover rounded-xl shrink-0" onerror="this.style.display='none'">` : '<div class="w-12 h-12 bg-gray-200 dark:bg-gray-800 rounded-xl shrink-0 flex items-center justify-center text-xs">📝</div>'}
                            <div class="truncate">
                                <h4 class="font-semibold text-xs sm:text-sm truncate text-gray-900 dark:text-white">${title}</h4>
                                <p class="text-[10px] text-gray-400 mt-0.5">${timeStr}</p>
                                <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${isPub ? 'bg-green-100 text-green-700 dark:bg-green-950/60 dark:text-green-400' : 'bg-yellow-100 text-yellow-700 dark:bg-yellow-950/60 dark:text-yellow-400'}">${isPub ? 'Published' : 'Unpublished'}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <button onclick="editPost('${post.id}')" class="px-3 py-1.5 bg-gray-100 dark:bg-[#262626] hover:bg-gray-200 dark:hover:bg-[#333] text-xs font-semibold rounded-xl transition">Edit</button>
                            <button onclick="toggleStatus('${post.id}', '${post.status || 'published'}')" class="px-3 py-1.5 bg-gray-100 dark:bg-[#262626] hover:bg-gray-200 dark:hover:bg-[#333] text-xs font-semibold rounded-xl transition">${isPub ? 'Unpublish' : 'Publish'}</button>
                            <button onclick="deletePost('${post.id}')" class="px-3 py-1.5 bg-red-600/10 hover:bg-red-600 hover:text-white text-red-600 dark:text-red-400 text-xs font-semibold rounded-xl transition">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        async function loadAdminPosts() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let posts = [];
                querySnapshot.forEach(doc => {
                    posts.push({ id: doc.id, ...doc.data() });
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                allAdminPosts = posts;
                renderAdminPosts();
            } catch (err) {
                console.error("Admin load error:", err);
                document.getElementById('adminPostsList').innerHTML = `<p class="text-red-500 text-xs">Failed to load posts. Check Firebase Rules.</p>`;
            }
        }

        loadAdminPosts();
    </script>
</body>
</html>
