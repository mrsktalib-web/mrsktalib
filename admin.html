<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <!-- Login Section -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-red-500">SK TALIB Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Email</label>
                    <input type="email" id="adminEmail" value="mrsktalib@gmail.com" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" required>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" required>
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 p-3 rounded-lg font-bold transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden p-6 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-red-500">Welcome, SK TALIB</h1>
            <div class="space-x-3">
                <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm">View Website</a>
                <button id="logoutBtn" class="bg-red-900/40 hover:bg-red-900 px-4 py-2 rounded-lg text-sm text-red-300">Logout</button>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 mb-8">
            <h3 class="text-xl font-semibold mb-4">Add New Post / Video</h3>
            <form id="postForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Title</label>
                    <input type="text" id="postTitle" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" placeholder="Video or Post Title" required>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Media URL (YouTube link / Image / Cloudinary)</label>
                    <input type="text" id="postMedia" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" placeholder="Paste link here" required>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Category / Section</label>
                    <select id="postCategory" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500">
                        <option value="feed">Home Feed / Reel</option>
                        <option value="movies">Movies List</option>
                        <option value="products">Products</option>
                        <option value="books">Books</option>
                    </select>
                </div>
                <button type="submit" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg font-bold transition w-full">Publish to Website</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mrsktalib-4ab8e",
            authDomain: "mrsktalib-4ab8e.firebaseapp.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const loginSection = document.getElementById('loginSection');
        const adminDashboard = document.getElementById('adminDashboard');
        const logoutBtn = document.getElementById('logoutBtn');
        const postForm = document.getElementById('postForm');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Login Failed: ' + error.message);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminDashboard.classList.remove('hidden');
            } else {
                loginSection.classList.remove('hidden');
                adminDashboard.classList.add('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('postTitle').value;
            const media = document.getElementById('postMedia').value;
            const category = document.getElementById('postCategory').value;

            try {
                await addDoc(collection(db, "posts"), {
                    title,
                    media,
                    category,
                    createdAt: new Date()
                });
                alert('Successfully Published!');
                postForm.reset();
            } catch (error) {
                alert('Error adding post: ' + error.message);
            }
        });
    </script>
</body>
  </html>
