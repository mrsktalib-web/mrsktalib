<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SK TALIB</title>
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 22, 0.9) 0%, rgba(12, 12, 12, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.7);
        }
        html:not(.dark) .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 245, 247, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.08);
        }
        .premium-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.08) 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 4px 20px 0 rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="bg-[#f4f4f6] dark:bg-[#080808] text-gray-900 dark:text-gray-100 min-h-screen py-8 px-4 antialiased">

    <!-- Login Section -->
    <div id="loginSection" class="max-w-md mx-auto mt-20">
        <div class="glass-card p-8 rounded-3xl space-y-6 border border-amber-500/40">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-black tracking-wider text-amber-500">ADMIN PANEL</h1>
                <p class="text-xs text-gray-400">Enter your secure password to continue</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="adminPassword" placeholder="Enter Password" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                <button onclick="checkLogin()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-black py-3 rounded-2xl text-sm transition shadow-lg shadow-amber-500/30">Login</button>
                <p id="loginError" class="text-xs text-red-500 text-center hidden">Incorrect Password! Hint: SKTALIB@9037</p>
            </div>
            <div class="text-center">
                <a href="index.html" class="text-xs text-amber-500 hover:underline">← Back to Website</a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden until login) -->
    <div id="dashboardSection" class="max-w-3xl mx-auto space-y-6 hidden">
        <div class="flex justify-between items-center bg-black/60 p-4 rounded-2xl border border-amber-500/30">
            <h1 class="text-lg font-black text-amber-500">SK TALIB Admin Dashboard</h1>
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-xs bg-[#171717] hover:bg-amber-500 hover:text-gray-950 px-3 py-2 rounded-xl font-bold transition border border-amber-500/30">View Site</a>
                <button onclick="logoutAdmin()" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-2 rounded-xl font-bold transition border border-red-500/30">Logout</button>
            </div>
        </div>

        <!-- Publish / Add Post Section -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h2 class="text-base font-black text-amber-500 uppercase">Publish New Post / Item</h2>
            <div class="space-y-3">
                <select id="postCategory" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    <option value="home">Home Feed Post</option>
                    <option value="about_me">About Me Section</option>
                    <option value="about_social">Social Media Link</option>
                    <option value="about_contact">Contact Option</option>
                    <option value="movie">Movie / Video</option>
                    <option value="products">Product Item</option>
                    <option value="book">Book / Writing</option>
                    <option value="gallery">Gallery Photo</option>
                </select>
                <input type="text" id="postTitle" placeholder="Title / Name" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <input type="text" id="postMedia" placeholder="Media Image / Video URL (https://...)" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <input type="text" id="postLink" placeholder="Redirect Link (for Social / Contact)" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <input type="text" id="postPrice" placeholder="Price (optional, e.g. ₹999)" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <textarea id="postDesc" placeholder="Description / Content..." rows="4" class="w-full bg-black/40 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></textarea>
                <button onclick="publishPost()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-black py-3 rounded-2xl text-xs transition shadow-md shadow-amber-500/30">Publish Now</button>
            </div>
        </div>

        <!-- Manage Posts List -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h2 class="text-base font-black text-amber-500 uppercase">Manage Existing Posts</h2>
            <div id="adminPostsList" class="space-y-3">
                <p class="text-xs text-gray-500 text-center py-4">Loading posts...</p>
            </div>
        </div>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check if already logged in via sessionStorage
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadAdminPosts();
        }

        window.checkLogin = function() {
            const pwd = document.getElementById('adminPassword').value.trim();
            if (pwd === "SKTALIB@9037") {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadAdminPosts();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        window.logoutAdmin = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminPassword').value = "";
        }

        window.publishPost = async function() {
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value.trim();
            const media = document.getElementById('postMedia').value.trim();
            const redirectLink = document.getElementById('postLink').value.trim();
            const price = document.getElementById('postPrice').value.trim();
            const desc = document.getElementById('postDesc').value.trim();

            if (!title && !desc && !media) {
                alert("Please add at least a title, description or media.");
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    category: category,
                    titles: { en: title },
                    descriptions: { en: desc },
                    media: media,
                    redirectLink: redirectLink,
                    price: price,
                    status: 'published',
                    createdAt: Date.now()
                });
                alert("Published successfully!");
                document.getElementById('postTitle').value = "";
                document.getElementById('postMedia').value = "";
                document.getElementById('postLink').value = "";
                document.getElementById('postPrice').value = "";
                document.getElementById('postDesc').value = "";
                loadAdminPosts();
            } catch (err) {
                console.error("Publish error:", err);
                alert("Failed to publish. Check console.");
            }
        }

        async function loadAdminPosts() {
            const listContainer = document.getElementById('adminPostsList');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let posts = [];
                querySnapshot.forEach(docSnap => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (posts.length === 0) {
                    listContainer.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No posts found.</p>`;
                    return;
                }

                listContainer.innerHTML = "";
                posts.forEach(post => {
                    const title = post.titles?.en || 'Untitled';
                    const cat = post.category || 'general';
                    listContainer.innerHTML += `
                        <div class="flex justify-between items-center p-3 rounded-2xl bg-black/40 border border-amber-500/20 text-xs">
                            <div>
                                <span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-md font-bold uppercase text-[10px]">${cat}</span>
                                <p class="font-bold text-white mt-1">${title}</p>
                            </div>
                            <button onclick="deletePost('${post.id}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl font-bold transition">Delete</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Load admin posts error:", err);
                listContainer.innerHTML = `<p class="text-xs text-red-500 text-center py-4">Error loading posts.</p>`;
            }
        }

        window.deletePost = async function(id) {
            if (confirm("Are you sure you want to delete this post?")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("Deleted successfully!");
                    loadAdminPosts();
                } catch (err) {
                    console.error("Delete error:", err);
                    alert("Failed to delete.");
                }
            }
        }
    </script>
</body>
</html>
