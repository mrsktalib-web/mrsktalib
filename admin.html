<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Login Section -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-red-500">SK TALIB ADMIN PANEL</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" required>
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 p-3 rounded-lg font-bold transition">Login</button>
                <p id="loginError" class="text-red-400 text-xs text-center mt-2"></p>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden p-6 max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-red-500">SK TALIB ADMIN PANEL</h1>
            <div class="space-x-3">
                <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm">View Website</a>
                <button id="logoutBtn" class="bg-red-900/40 hover:bg-red-900 px-4 py-2 rounded-lg text-sm text-red-300">Logout</button>
            </div>
        </div>

        <!-- Add Post Form -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 mb-8 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-red-400">Upload New Content</h3>
                <button type="button" onclick="autoTranslateAll()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-xs font-bold transition shadow">✨ Auto-Translate</button>
            </div>

            <form id="postForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Select Category</label>
                    <select id="postCategory" onchange="handleCategoryChange(this.value)" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500 text-sm">
                        <option value="feed">Home Feed (Photo / YouTube Video)</option>
                        <option value="movies">Movies / Web Series</option>
                        <option value="products">Products</option>
                    </select>
                </div>

                <div id="priceFieldWrapper" class="hidden">
                    <label class="block text-sm mb-1 text-gray-400">Product Price (₹)</label>
                    <input type="text" id="postPrice" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="e.g. ₹999">
                </div>

                <!-- Media Type Selection (Photo upload or YouTube Link) -->
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Media Type</label>
                    <select id="mediaType" onchange="handleMediaType(this.value)" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-sm mb-3">
                        <option value="photo">Upload Photo</option>
                        <option value="youtube">YouTube Video Link</option>
                    </select>
                </div>

                <div id="photoUploadWrapper">
                    <label class="block text-sm mb-1 text-gray-400">Upload Image</label>
                    <input type="file" id="mediaFile" accept="image/*" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-700">
                </div>

                <div id="youtubeLinkWrapper" class="hidden">
                    <label class="block text-sm mb-1 text-gray-400">YouTube Video URL</label>
                    <input type="text" id="youtubeUrl" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="https://www.youtube.com/watch?v=...">
                </div>

                <!-- 6 Languages Section -->
                <div class="border-t border-gray-700 pt-4 space-y-4">
                    <h4 class="text-sm font-bold text-red-400 uppercase tracking-wider">Titles & Descriptions in 6 Languages:</h4>
                    
                    <div class="bg-gray-900/60 p-4 rounded-lg border border-gray-700 space-y-2">
                        <span class="text-xs font-bold text-red-400">1. English (Primary - Type Here)</span>
                        <input type="text" id="title_en" placeholder="English Title / Name" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" required>
                        <textarea id="desc_en" placeholder="English Description" rows="2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm"></textarea>
                    </div>

                    <div class="bg-gray-900/60 p-4 rounded-lg border border-gray-700 space-y-2">
                        <span class="text-xs font-bold text-red-400">2. Roman Hindi</span>
                        <input type="text" id="title_roman_hi" placeholder="Roman Hindi Title" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm">
                        <textarea id="desc_roman_hi" placeholder="Roman Hindi Description" rows="2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm"></textarea>
                    </div>

                    <div class="bg-gray-900/60 p-4 rounded-lg border border-gray-700 space-y-2">
                        <span class="text-xs font-bold text-red-400">3. Hindi (हिन्दी)</span>
                        <input type="text" id="title_hi" placeholder="हिन्दी टाइटल" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm">
                        <textarea id="desc_hi" placeholder="हिन्दी विवरण" rows="2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm"></textarea>
                    </div>

                    <div class="bg-gray-900/60 p-4 rounded-lg border border-gray-700 space-y-2">
                        <span class="text-xs font-bold text-red-400">4. Urdu (اردو)</span>
                        <input type="text" id="title_ur" placeholder="اردو عنوان" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm">
                        <textarea id="desc_ur" placeholder="اردو تفصیل" rows="2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm"></textarea>
                    </div>

                    <div class="bg-gray-900/60 p-4 rounded-lg border border-gray-700 space-y-2">
                        <span class="text-xs font-bold text-red-400">5. Bengali (বাংলা)</span>
                        <input type="text" id="title_bn" placeholder="বাংলা শিরোনাম" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm">
                        <textarea id="desc_bn" placeholder="বাংলা বিবরণ" rows="2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm"></textarea>
                    </div>

                    <div class="bg-gray-900/60 p-4 rounded-lg border border-gray-700 space-y-2">
                        <span class="text-xs font-bold text-red-400">6. Odia (ଓଡ଼ିଆ)</span>
                        <input type="text" id="title_or" placeholder="ଓଡ଼ିଆ ଶୀର୍ଷକ" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm">
                        <textarea id="desc_or" placeholder="ଓଡ଼ିଆ ବିବରଣୀ" rows="2" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm"></textarea>
                    </div>
                </div>

                <button type="submit" id="publishBtn" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg font-bold transition w-full shadow-lg">Publish Post</button>
            </form>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h3 class="text-xl font-semibold mb-4 text-red-400">Manage Published Content</h3>
            <div id="managePostsContainer" class="space-y-3">
                <p class="text-gray-400 text-sm">Loading posts...</p>
            </div>
        </div>
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const loginSection = document.getElementById('loginSection');
        const adminDashboard = document.getElementById('adminDashboard');
        const logoutBtn = document.getElementById('logoutBtn');
        const postForm = document.getElementById('postForm');
        const loginError = document.getElementById('loginError');

        if (sessionStorage.getItem('isAdmin') === 'true') {
            loginSection.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
            loadManagePosts();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value.trim();
            if (pass === 'SKTALIB@9037') {
                sessionStorage.setItem('isAdmin', 'true');
                loginSection.classList.add('hidden');
                adminDashboard.classList.remove('hidden');
                loadManagePosts();
            } else {
                loginError.innerText = "Incorrect Password!";
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('isAdmin');
            location.reload();
        });

        window.handleCategoryChange = function(cat) {
            const priceWrapper = document.getElementById('priceFieldWrapper');
            if (cat === 'products') {
                priceWrapper.classList.remove('hidden');
            } else {
                priceWrapper.classList.add('hidden');
            }
        }

        window.handleMediaType = function(type) {
            const photoWrapper = document.getElementById('photoUploadWrapper');
            const ytWrapper = document.getElementById('youtubeLinkWrapper');
            if(type === 'youtube') {
                photoWrapper.classList.add('hidden');
                ytWrapper.classList.remove('hidden');
            } else {
                photoWrapper.classList.remove('hidden');
                ytWrapper.classList.add('hidden');
            }
        }

        window.autoTranslateAll = async function() {
            const titleEn = document.getElementById('title_en').value.trim();
            const descEn = document.getElementById('desc_en').value.trim();

            if(!titleEn) {
                alert("Please enter English Title first!");
                return;
            }

            try {
                async function trans(text, targetLang) {
                    if(!text) return "";
                    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);
                    const data = await res.json();
                    return data.responseData ? data.responseData.translatedText : text;
                }

                const hiT = await trans(titleEn, 'hi');
                const hiD = await trans(descEn, 'hi');
                const urT = await trans(titleEn, 'ur');
                const urD = await trans(descEn, 'ur');
                const bnT = await trans(titleEn, 'bn');
                const bnD = await trans(descEn, 'bn');
                const orT = await trans(titleEn, 'or');
                const orD = await trans(descEn, 'or');

                document.getElementById('title_hi').value = hiT;
                document.getElementById('desc_hi').value = hiD;
                document.getElementById('title_ur').value = urT;
                document.getElementById('desc_ur').value = urD;
                document.getElementById('title_bn').value = bnT;
                document.getElementById('desc_bn').value = bnD;
                document.getElementById('title_or').value = orT;
                document.getElementById('desc_or').value = orD;

                document.getElementById('title_roman_hi').value = titleEn;
                document.getElementById('desc_roman_hi').value = descEn;

                alert("Successfully Auto-Translated!");
            } catch(err) {
                console.error(err);
                alert("Translation error.");
            }
        }

        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const publishBtn = document.getElementById('publishBtn');
            publishBtn.innerText = "Publishing...";
            publishBtn.disabled = true;

            const category = document.getElementById('postCategory').value;
            const price = category === 'products' ? (document.getElementById('postPrice').value || '') : '';
            const mediaType = document.getElementById('mediaType').value;
            
            let mediaUrl = "";
            if (mediaType === 'youtube') {
                mediaUrl = document.getElementById('youtubeUrl').value.trim();
            } else {
                const fileInput = document.getElementById('mediaFile');
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    mediaUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800;
                                const MAX_HEIGHT = 800;
                                let width = img.width;
                                let height = img.height;
                                if (width > height) {
                                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                                } else {
                                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                                }
                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);
                                resolve(canvas.toDataURL('image/jpeg', 0.7));
                            }
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }
            }

            const titles = {
                en: document.getElementById('title_en').value,
                roman_hi: document.getElementById('title_roman_hi').value || document.getElementById('title_en').value,
                hi: document.getElementById('title_hi').value || document.getElementById('title_en').value,
                ur: document.getElementById('title_ur').value || document.getElementById('title_en').value,
                bn: document.getElementById('title_bn').value || document.getElementById('title_en').value,
                or: document.getElementById('title_or').value || document.getElementById('title_en').value
            };

            const descriptions = {
                en: document.getElementById('desc_en').value,
                roman_hi: document.getElementById('desc_roman_hi').value,
                hi: document.getElementById('desc_hi').value,
                ur: document.getElementById('desc_ur').value,
                bn: document.getElementById('desc_bn').value,
                or: document.getElementById('desc_or').value
            };

            try {
                await addDoc(collection(db, "posts"), {
                    title: titles.en,
                    titles: titles,
                    descriptions: descriptions,
                    media: mediaUrl,
                    mediaType: mediaType,
                    category,
                    price,
                    status: 'published',
                    createdAt: new Date()
                });
                alert('Successfully Published!');
                postForm.reset();
                document.getElementById('priceFieldWrapper').classList.add('hidden');
                loadManagePosts();
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                publishBtn.innerText = "Publish Post";
                publishBtn.disabled = false;
            }
        });

        async function loadManagePosts() {
            const container = document.getElementById('managePostsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if(querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-sm">No posts found.</p>`;
                    return;
                }
                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;
                    const statusColor = post.status === 'unpublished' ? 'text-yellow-500' : 'text-green-500';

                    container.innerHTML += `
                        <div class="bg-gray-900 border border-gray-700 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-gray-800 text-red-400">${post.category}</span>
                                <h4 class="font-semibold text-white mt-1">${post.title}</h4>
                                <p class="text-xs text-gray-400">Status: <span class="${statusColor}">${post.status || 'published'}</span></p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="togglePublish('${postId}', '${post.status}')" class="bg-yellow-600 hover:bg-yellow-700 px-3 py-1.5 rounded text-xs font-semibold">${post.status === 'unpublished' ? 'Publish' : 'Unpublish'}</button>
                                <button onclick="deletePost('${postId}')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-xs font-semibold">Delete</button>
                            </div>
                        </div
