<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Login Section -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-red-500">SK TALIB Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" required>
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 p-3 rounded-lg font-bold transition">Login</button>
                <p id="loginError" class="text-red-400 text-xs text-center mt-2"></p>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden p-6 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-red-500">Welcome, SK TALIB</h1>
            <div class="space-x-3">
                <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm">View Website</a>
                <button id="logoutBtn" class="bg-red-900/40 hover:bg-red-900 px-4 py-2 rounded-lg text-sm text-red-300">Logout</button>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 mb-8">
            <h3 class="text-xl font-semibold mb-4">Add New Post (Multi-Language)</h3>
            <form id="postForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Media URL (YouTube / Image link)</label>
                    <input type="text" id="postMedia" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500" placeholder="Paste link here" required>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Category / Section</label>
                    <select id="postCategory" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500">
                        <option value="feed">Home Feed / Reel</option>
                        <option value="movies">Movies List</option>
                        <option value="products">Products</option>
                        <option value="books">Books</option>
                    </select>
                </div>

                <!-- 6 Language Title Inputs -->
                <div class="border-t border-gray-700 pt-4 space-y-3">
                    <h4 class="text-sm font-semibold text-red-400">Enter Title in 6 Languages:</h4>
                    <div>
                        <label class="block text-xs mb-1 text-gray-400">English Title</label>
                        <input type="text" id="title_en" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="Title in English" required>
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-gray-400">Roman Hindi Title</label>
                        <input type="text" id="title_roman_hi" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="Title in Roman Hindi">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-gray-400">Hindi Title (हिन्दी)</label>
                        <input type="text" id="title_hi" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="हिन्दी में टाइटल">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-gray-400">Urdu Title (اردو)</label>
                        <input type="text" id="title_ur" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="اردو میں عنوان">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-gray-400">Bengali Title (বাংলা)</label>
                        <input type="text" id="title_bn" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="বাংলায় শিরোনাম">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-gray-400">Odia Title (ଓଡ଼ିଆ)</label>
                        <input type="text" id="title_or" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="ଓଡ଼ିଆରେ शिर्ଷକ">
                    </div>
                </div>

                <button type="submit" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg font-bold transition w-full">Publish to Website</button>
            </form>
        </div>
    </div>

    <!-- Firebase & Direct Login Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mrsktalib-4ab8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const loginSection = document.getElementById('loginSection');
        const adminDashboard = document.getElementById('adminDashboard');
        const logoutBtn = document.getElementById('logoutBtn');
        const postForm = document.getElementById('postForm');
        const loginError = document.getElementById('loginError');

        // Check if already logged in during this session
        if (sessionStorage.getItem('isAdmin') === 'true') {
            loginSection.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
        }

        // Direct password login (Password: SKTALIB@9037)
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value.trim();
            
            if (pass === 'SKTALIB@9037') {
                sessionStorage.setItem('isAdmin', 'true');
                loginSection.classList.add('hidden');
                adminDashboard.classList.remove('hidden');
            } else {
                loginError.innerText = "Incorrect Password! Please check and try again.";
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('isAdmin');
            location.reload();
        });

        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const media = document.getElementById('postMedia').value;
            const category = document.getElementById('postCategory').value;

            const titles = {
                en: document.getElementById('title_en').value,
                roman_hi: document.getElementById('title_roman_hi').value || document.getElementById('title_en').value,
                hi: document.getElementById('title_hi').value || document.getElementById('title_en').value,
                ur: document.getElementById('title_ur').value || document.getElementById('title_en').value,
                bn: document.getElementById('title_bn').value || document.getElementById('title_en').value,
                or: document.getElementById('title_or').value || document.getElementById('title_or').value || document.getElementById('title_en').value
            };

            try {
                await addDoc(collection(db, "posts"), {
                    title: titles.en,
                    titles: titles,
                    media,
                    category,
                    createdAt: new Date()
                });
                alert('Successfully Published in 6 Languages!');
                postForm.reset();
            } catch (error) {
                alert('Error adding post: ' + error.message);
            }
        });
    </script>
</body>
    </html>
