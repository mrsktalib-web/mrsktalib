<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SK TALIB</title>
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080808; color: #fff; }
        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 22, 0.9) 0%, rgba(12, 12, 12, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 antialiased flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full mt-10">
        <!-- Login Box -->
        <div id="loginBox" class="glass-card p-8 rounded-3xl space-y-6 border border-amber-500/40">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-black tracking-wider text-amber-500">ADMIN PANEL</h1>
                <p class="text-xs text-gray-400">Enter your password to manage website</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" placeholder="Enter Password" class="w-full bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                <button onclick="verifyLogin()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-black py-3 rounded-2xl text-sm transition shadow-lg shadow-amber-500/30">Login</button>
                <p id="errorMsg" class="text-xs text-red-500 text-center hidden">Incorrect Password! (SKTALIB@9037)</p>
            </div>
            <div class="text-center">
                <a href="index.html" class="text-xs text-amber-500 hover:underline">← Back to Website</a>
            </div>
        </div>

        <!-- Dashboard Box (Hidden initially) -->
        <div id="dashboardBox" style="display: none;" class="space-y-6">
            <div class="flex justify-between items-center bg-black/60 p-4 rounded-2xl border border-amber-500/30">
                <h1 class="text-sm font-black text-amber-500">SK TALIB Dashboard</h1>
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="text-xs bg-[#171717] hover:bg-amber-500 hover:text-gray-950 px-3 py-2 rounded-xl font-bold transition border border-amber-500/30">View Site</a>
                    <button onclick="doLogout()" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-2 rounded-xl font-bold transition border border-red-500/30">Logout</button>
                </div>
            </div>

            <div class="glass-card p-6 rounded-3xl space-y-4">
                <h2 class="text-sm font-black text-amber-500 uppercase">Publish New Post</h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Select Category</label>
                        <select id="postCategory" class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                            <option value="home">Home Feed Post</option>
                            <option value="about_me">About Me Section</option>
                            <option value="about_social">Social Media Link (Logo + Name)</option>
                            <option value="about_contact">Contact Option (Telegram/Gmail)</option>
                            <option value="movie">Movie / Video</option>
                            <option value="products">Product Item</option>
                            <option value="book">Book / Writing</option>
                            <option value="gallery">Gallery Photo</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Media Type</label>
                        <select id="mediaType" class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                            <option value="image">Photo / Image URL</option>
                            <option value="video_link">Video Embed Link (YouTube / Direct)</option>
                            <option value="none">Text Only (No Media)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Title / Name</label>
                        <input type="text" id="postTitle" placeholder="Enter title or name..." class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Media URL (Image or Video Link)</label>
                        <input type="text" id="postMedia" placeholder="https://..." class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Redirect Link (For Social / Contact / Buttons)</label>
                        <input type="text" id="postLink" placeholder="https://t.me/... or mailto:..." class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Price (Optional, e.g. ₹999)</label>
                        <input type="text" id="postPrice" placeholder="₹999" class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-gray-400 ml-1">Description / Content</label>
                        <textarea id="postDesc" placeholder="Write description or content here..." rows="3" class="w-full mt-1 bg-black/60 border border-amber-500/30 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></textarea>
                    </div>

                    <button onclick="publishNewPost()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-black py-3 rounded-2xl text-xs transition shadow-md shadow-amber-500/30 mt-2">Publish Now</button>
                </div>
            </div>

            <div class="glass-card p-6 rounded-3xl space-y-4">
                <h2 class="text-sm font-black text-amber-500 uppercase">Manage Posts</h2>
                <div id="postsList" class="space-y-3">
                    <p class="text-xs text-gray-500 text-center py-4">Loading posts...</p>
                </div>
            </div>
        </div>
                            </div>
                                <footer class="py-4 text-center text-xs text-gray-600">
        &copy; 2026 SK TALIB. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginBox = document.getElementById('loginBox');
        const dashboardBox = document.getElementById('dashboardBox');

        if (sessionStorage.getItem('talibAdminAuth') === 'true') {
            loginBox.style.display = 'none';
            dashboardBox.style.display = 'block';
            fetchAdminPosts();
        }

        window.verifyLogin = function() {
            const val = document.getElementById('passwordInput').value.trim();
            if (val === "SKTALIB@9037") {
                sessionStorage.setItem('talibAdminAuth', 'true');
                loginBox.style.display = 'none';
                dashboardBox.style.display = 'block';
                fetchAdminPosts();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        window.doLogout = function() {
            sessionStorage.removeItem('talibAdminAuth');
            dashboardBox.style.display = 'none';
            loginBox.style.display = 'block';
            document.getElementById('passwordInput').value = "";
        }

        window.publishNewPost = async function() {
            const category = document.getElementById('postCategory').value;
            const mediaType = document.getElementById('mediaType').value;
            const title = document.getElementById('postTitle').value.trim();
            const media = document.getElementById('postMedia').value.trim();
            const redirectLink = document.getElementById('postLink').value.trim();
            const price = document.getElementById('postPrice').value.trim();
            const desc = document.getElementById('postDesc').value.trim();

            if (!title && !desc && !media) {
                alert("Please add at least title, description or media.");
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    category: category,
                    mediaType: mediaType,
                    titles: { en: title },
                    descriptions: { en: desc },
                    media: media,
                    redirectLink: redirectLink,
                    price: price,
                    status: 'published',
                    createdAt: Date.now()
                });
                alert("Published successfully!");
                document.getElementById('postTitle').value = "";
                document.getElementById('postMedia').value = "";
                document.getElementById('postLink').value = "";
                document.getElementById('postPrice').value = "";
                document.getElementById('postDesc').value = "";
                fetchAdminPosts();
            } catch (err) {
                console.error("Error publishing:", err);
                alert("Failed to publish.");
            }
        }

        async function fetchAdminPosts() {
            const container = document.getElementById('postsList');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let list = [];
                querySnapshot.forEach(d => {
                    list.push({ id: d.id, ...d.data() });
                });
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (list.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No posts found.</p>`;
                    return;
                }

                container.innerHTML = "";
                list.forEach(item => {
                    const titleText = item.titles?.en || 'Untitled';
                    const categoryName = item.category || 'general';
                    const mType = item.mediaType ? `[${item.mediaType}]` : '';
                    container.innerHTML += `
                        <div class="flex justify-between items-center p-3 rounded-2xl bg-black/60 border border-amber-500/20 text-xs">
                            <div>
                                <span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-md font-bold uppercase text-[10px]">${categoryName} ${mType}</span>
                                <p class="font-bold text-white mt-1">${titleText}</p>
                            </div>
                            <button onclick="removePost('${item.id}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl font-bold transition">Delete</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading posts:", err);
                container.innerHTML = `<p class="text-xs text-red-500 text-center py-4">Error loading posts.</p>`;
            }
        }

        window.removePost = async function(id) {
            if (confirm("Delete this post?")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("Deleted successfully!");
                    fetchAdminPosts();
                } catch (err) {
                    console.error("Delete error:", err);
                    alert("Failed to delete.");
                }
            }
        }
    </script>
</body>
</html>
