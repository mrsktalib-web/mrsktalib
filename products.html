<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - SK TALIB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen pt-28 sm:pt-32 transition-colors duration-300 antialiased">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center shrink-0">
                <a href="index.html" class="text-base sm:text-xl font-bold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center space-x-1 text-xs font-semibold">
                <a href="index.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Home</a>
                <a href="about.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">About</a>
                <a href="movie.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Movie</a>
                <a href="products.html" class="text-red-600 dark:text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition">Products</a>
                <a href="book.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Book</a>
                <a href="chat.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Chat with AI</a>
            </nav>

            <!-- Right Controls: Translate & Theme -->
            <div class="flex items-center space-x-2.5 shrink-0">
                <div class="relative" id="langDropdownContainer">
                    <button type="button" onclick="toggleLangMenu()" class="flex items-center space-x-1.5 bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-800 rounded-xl px-2.5 py-1.5 text-xs font-medium hover:border-red-500 transition">
                        <span>🌐</span>
                        <span id="currentLangLabel">English</span>
                        <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="langMenu" class="hidden absolute right-0 mt-2 w-36 bg-white dark:bg-[#171717] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl overflow-hidden z-50">
                        <button type="button" onclick="selectLanguage('en', 'English')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#262626] transition flex items-center justify-between">
                            <span>English</span>
                            <span id="check_en" class="text-red-500 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectLanguage('roman_hi', 'Roman Hindi')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#262626] border-t border-gray-100 dark:border-gray-800 transition flex items-center justify-between">
                            <span>Roman Hindi</span>
                            <span id="check_roman_hi" class="text-red-500 font-bold hidden">✓</span>
                        </button>
                    </div>
                </div>

                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-8 h-8 rounded-xl bg-gray-100 dark:bg-[#171717] border border-gray-200 dark:border-gray-800 hover:bg-gray-200 dark:hover:bg-[#262626] transition" title="Toggle Theme">
                    <span id="modeIcon" class="text-xs">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Horizontal Nav Bar -->
    <div class="fixed top-[57px] left-0 w-full z-40 flex lg:hidden overflow-x-auto no-scrollbar space-x-4 px-4 py-2.5 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="text-gray-600 dark:text-gray-400">Home</a>
        <a href="about.html" class="text-gray-600 dark:text-gray-400">About</a>
        <a href="movie.html" class="text-gray-600 dark:text-gray-400">Movie</a>
        <a href="products.html" class="text-red-600 dark:text-red-500">Products</a>
        <a href="book.html" class="text-gray-600 dark:text-gray-400">Book</a>
        <a href="chat.html" class="text-gray-600 dark:text-gray-400">Chat with AI</a>
    </div>

    <!-- Main Products Container -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6">
        
        <div class="text-center">
            <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Our Products</h2>
            <p class="text-xs text-red-600 dark:text-red-400 font-semibold mt-1">Brass Lights & Decorative Collection</p>
        </div>

        <div id="productsGridContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-center py-12 text-gray-500 text-xs col-span-full border border-dashed border-gray-300 dark:border-gray-800 rounded-3xl bg-gray-50/50 dark:bg-[#171717]/50">
                Loading products...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-8 text-center px-4 mt-12 mb-16">
        <p class="text-xs text-gray-500 dark:text-gray-400">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = localStorage.getItem('site_lang') || 'en';
        let allProducts = [];

        window.toggleLangMenu = function() {
            document.getElementById('langMenu').classList.toggle('hidden');
        }

        window.selectLanguage = function(lang, label) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            document.getElementById('currentLangLabel').innerText = label;
            document.getElementById('check_en').classList.toggle('hidden', lang !== 'en');
            document.getElementById('check_roman_hi').classList.toggle('hidden', lang !== 'roman_hi');
            document.getElementById('langMenu').classList.add('hidden');
            renderProducts();
        }

        document.addEventListener('click', function(e) {
            const container = document.getElementById('langDropdownContainer');
            if (container && !container.contains(e.target)) {
                document.getElementById('langMenu').classList.add('hidden');
            }
        });

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            modeIcon.innerText = '☀️';
        } else {
            html.classList.add('dark');
            modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        function renderProducts() {
            const container = document.getElementById('productsGridContainer');
            if (!container) return;

            const filtered = allProducts.filter(p => p.category === 'products' && p.status !== 'unpublished');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500 text-xs col-span-full border border-dashed border-gray-300 dark:border-gray-800 rounded-3xl bg-gray-50/50 dark:bg-[#171717]/50">
                        No products found. Add products from your Admin Panel.
                    </div>
                `;
                return;
            }

            container.innerHTML = "";
            filtered.forEach(product => {
                const title = (product.titles && product.titles[currentLang]) ? product.titles[currentLang] : (product.titles?.en || 'Product');
                const desc = (product.descriptions && product.descriptions[currentLang]) ? product.descriptions[currentLang] : (product.descriptions?.en || '');
                const price = product.price || '';
                const link = product.redirectLink || '#';

                container.innerHTML += `
                    <div class="bg-gray-50 dark:bg-[#171717] rounded-3xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm flex flex-col justify-between">
                        <div>
                            ${product.media ? `<img src="${product.media}" class="w-full h-56 object-cover border-b border-gray-200 dark:border-gray-800" loading="lazy">` : `<div class="w-full h-56 bg-gray-200 dark:bg-gray-800 flex items-center justify-center text-xs">No Image</div>`}
                            <div class="p-5">
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <h3 class="font-bold text-sm text-gray-900 dark:text-white">${title}</h3>
                                    ${price ? `<span class="bg-red-600/10 text-red-600 dark:text-red-400 font-bold text-xs px-2.5 py-1 rounded-xl shrink-0">${price}</span>` : ''}
                                </div>
                                ${desc ? `<p class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed mb-4 whitespace-pre-line">${desc}</p>` : ''}
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <a href="${link}" target="_blank" class="block w-full text-center bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">View / Buy Product</a>
                        </div>
                    </div>
                `;
            });
        }

        async function loadProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let fetched = [];
                querySnapshot.forEach(doc => {
                    fetched.push({ id: doc.id, ...doc.data() });
                });
                fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                allProducts = fetched;
                renderProducts();
            } catch (err) {
                console.error("Products load error:", err);
            }
        }

        loadProducts();
    </script>
</body>
  </html>
