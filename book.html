
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>My Book | SK TALIB</title>

<style>
:root{
  --bg:#080808;
  --card:#111;
  --text:#f5f5f5;
  --muted:#aaa;
  --gold:#d4af37;
  --line:#493b18;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  transition:.25s;
}
body.light{
  --bg:#f5f5f5;
  --card:#fff;
  --text:#171717;
  --muted:#666;
  --line:#d8bd70;
}
header{
  padding:17px 16px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.logo{
  color:var(--gold);
  font-size:19px;
  font-weight:bold;
  letter-spacing:1px;
}
.controls{
  display:flex;
  align-items:center;
  gap:8px;
}
.control{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 11px;
  font-size:12px;
  cursor:pointer;
}
.lang-wrap{position:relative}
.lang-menu{
  display:none;
  position:absolute;
  right:0;
  top:43px;
  width:155px;
  background:var(--card);
  border:1px solid var(--gold);
  border-radius:9px;
  z-index:10;
  overflow:hidden;
}
.lang-menu.show{display:block}
.lang-menu button{
  width:100%;
  display:block;
  text-align:left;
  padding:11px;
  background:none;
  color:var(--text);
  border:0;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
main{
  width:100%;
  max-width:750px;
  margin:auto;
  padding:35px 16px;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.book-card{
  background:var(--card);
  border:1px solid var(--gold);
  border-radius:15px;
  padding:45px 20px;
  text-align:center;
  box-shadow:0 0 20px rgba(212,175,55,.08);
}
.book-icon{
  font-size:100px;
  line-height:1.3;
  margin-bottom:15px;
  filter:drop-shadow(0 0 12px rgba(212,175,55,.35));
}
.book-title{
  color:var(--gold);
  font-size:36px;
  font-weight:bold;
  letter-spacing:1px;
  margin:8px 0 30px;
}
.gold-line{
  width:75px;
  height:2px;
  background:var(--gold);
  margin:0 auto 28px;
}
.status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid var(--gold);
  border-radius:12px;
  padding:16px 20px;
  color:var(--text);
  font-size:17px;
  font-weight:bold;
  max-width:100%;
}
.status-icon{
  color:var(--gold);
  font-size:23px;
}
.back{
  display:block;
  width:max-content;
  margin:30px auto 0;
  padding:11px 22px;
  border:1px solid var(--gold);
  border-radius:8px;
  color:var(--gold);
  text-decoration:none;
  font-size:14px;
}
footer{
  text-align:center;
  padding:18px 10px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}
@media(max-width:520px){
  header{padding:13px 11px}
  .logo{font-size:16px}
  .control{padding:8px;font-size:11px}
  main{padding:30px 13px}
  .book-card{padding:38px 13px}
  .book-icon{font-size:85px}
  .book-title{font-size:31px}
  .status{font-size:14px;padding:14px 12px}
}
</style>
</head>

<body>

<header>
  <div class="logo">SK TALIB</div>

  <div class="controls">
    <button class="control" id="themeBtn" onclick="toggleTheme()">
      ☾ DARK MODE
    </button>

    <div class="lang-wrap">
      <button class="control" onclick="toggleLang()" id="langBtn">
        ENGLISH ▾
      </button>

      <div class="lang-menu" id="langMenu">
        <button onclick="setLanguage('en')">English</button>
        <button onclick="setLanguage('rh')">Roman Hindi</button>
        <button onclick="setLanguage('ur')">Urdu</button>
        <button onclick="setLanguage('hi')">हिन्दी</button>
        <button onclick="setLanguage('or')">ଓଡ଼ିଆ</button>
      </div>
    </div>
  </div>
</header>

<main>

  <div class="book-card">

    <div class="book-icon">📖</div>

    <h1 class="book-title" id="bookTitle">
      My Book
    </h1>

    <div class="gold-line"></div>

    <div class="status">
      <span class="status-icon">✍</span>
      <span id="statusText">Abhi Likha Ja Raha Hai</span>
    </div>

  </div>

  <a class="back" href="index.html" id="backBtn">
    ← Back to Home
  </a>

</main>

<footer id="footerText">
  © 2026 SK TALIB. All Rights Reserved.
</footer>

<script>
const translations = {
  en:{
    title:"My Book",
    status:"Currently Being Written",
    back:"← Back to Home",
    footer:"© 2026 SK TALIB. All Rights Reserved.",
    lang:"ENGLISH"
  },
  rh:{
    title:"Meri Kitab",
    status:"Abhi Likha Ja Raha Hai",
    back:"← Home par wapas",
    footer:"© 2026 SK TALIB. Sabhi adhikar surakshit.",
    lang:"ROMAN HINDI"
  },
  ur:{
    title:"میری کتاب",
    status:"ابھی لکھی جا رہی ہے",
    back:"← ہوم پر واپس",
    footer:"© 2026 SK TALIB. جملہ حقوق محفوظ ہیں۔",
    lang:"اردو"
  },
  hi:{
    title:"मेरी किताब",
    status:"अभी लिखी जा रही है",
    back:"← होम पर वापस",
    footer:"© 2026 SK TALIB. सर्वाधिकार सुरक्षित।",
    lang:"हिन्दी"
  },
  or:{
    title:"ମୋ ବହି",
    status:"ବର୍ତ୍ତମାନ ଲେଖା ଚାଲିଛି",
    back:"← ହୋମକୁ ଫେରନ୍ତୁ",
    footer:"© 2026 SK TALIB. ସମସ୍ତ ଅଧିକାର ସଂରକ୍ଷିତ।",
    lang:"ଓଡ଼ିଆ"
  }
};

function setLanguage(lang){
  const t=translations[lang] || translations.en;

  document.getElementById("bookTitle").textContent=t.title;
  document.getElementById("statusText").textContent=t.status;
  document.getElementById("backBtn").textContent=t.back;
  document.getElementById("footerText").textContent=t.footer;
  document.getElementById("langBtn").textContent=t.lang+" ▾";

  localStorage.setItem("siteLanguage",lang);
  document.getElementById("langMenu").classList.remove("show");
}

function toggleLang(){
  document.getElementById("langMenu").classList.toggle("show");
}

function toggleTheme(){
  document.body.classList.toggle("light");

  const light=document.body.classList.contains("light");
  localStorage.setItem("siteTheme",light?"light":"dark");

  updateTheme();
}

function updateTheme(){
  const light=document.body.classList.contains("light");

  document.getElementById("themeBtn").textContent=
    light?"☀ LIGHT MODE":"☾ DARK MODE";

  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content",light?"#f5f5f5":"#080808");
}

if(localStorage.getItem("siteTheme")==="light"){
  document.body.classList.add("light");
}

updateTheme();

const savedLanguage=localStorage.getItem("siteLanguage") || "en";
setLanguage(savedLanguage);

document.addEventListener("click",function(e){
  if(!e.target.closest(".lang-wrap")){
    document.getElementById("langMenu").classList.remove("show");
  }
});
</script>

</body>
  </html>
