        }
        .glass-card:hover {

        }
    </style>
</head>

        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center shrink-0">
                <a href="index.html" class="text-base sm:text-xl font-extrabold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-white">TALIB</span></a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center space-x-1 text-xs font-semibold">
                <a href="index.html" class="text-gray-400 hover:text-white px-3 py-2 rounded-xl transition">Home</a>
                <a href="about.html" class="text-red-500 bg-red-500/10 border border-red-500/20 px-3 py-2 rounded-xl transition">About</a>
                <a href="movie.html" class="text-gray-400 hover:text-white px-3 py-2 rounded-xl transition">Movie</a>
                <a href="products.html" class="text-gray-400 hover:text-white px-3 py-2 rounded-xl transition">Products</a>

            </nav>

            <div class="flex items-center space-x-2.5 shrink-0">
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-[#171717] border border-white/10 hover:border-red-500/50 transition text-sm">

            </div>
        </div>
    </header>

    <!-- Mobile Horizontal Nav Bar -->
    <div class="fixed top-[57px] left-0 w-full z-40 flex lg:hidden overflow-x-auto no-scrollbar space-x-2.5 px-4 py-3 bg-[#0b0b0b]/90 backdrop-blur-xl border-b border-white/10 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Home</a>
        <a href="about.html" class="px-3.5 py-2 rounded-xl bg-red-600 text-white shadow-lg shadow-red-600/30">About</a>
        <a href="movie.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Movie</a>
        <a href="products.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Products</a>
        <a href="book.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Book</a>
        <a href="chat.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Chat with AI</a>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 space-y-8">
        
        <!-- Header Banner -->
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-black tracking-tight text-white">SK TALIB</h2>
            <div class="inline-block px-4 py-1 rounded-full bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold tracking-widest uppercase">
                About Me & Personal Space
            </div>
        </div>

        <!-- Premium Sub-navigation Tabs (No Emojis, Sleek Borders & Glow) -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5 p-2 bg-[#141414] rounded-2xl border border-white/10 shadow-inner">
            <a href="about-personal.html" class="text-center py-2.5 px-3 rounded-xl text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-600/30 transition">Personal</a>
            <a href="about-education.html" class="text-center py-2.5 px-3 rounded-xl text-xs font-bold text-gray-400 hover:text-white hover:bg-white/5 transition">Education</a>
            <a href="about-gallery.html" class="text-center py-2.5 px-3 rounded-xl text-xs font-bold text-gray-400 hover:text-white hover:bg-white/5 transition">Gallery</a>
            <a href="about-feelings.html" class="text-center py-2.5 px-3 rounded-xl text-xs font-bold text-gray-400 hover:text-white hover:bg-white/5 transition">Feelings</a>
            <a href="about-social.html" class="text-center py-2.5 px-3 rounded-xl text-xs font-bold text-gray-400 hover:text-white hover:bg-white/5 transition">Social</a>
            <a href="about-contact.html" class="text-center py-2.5 px-3 rounded-xl text-xs font-bold text-gray-400 hover:text-white hover:bg-white/5 transition">Contact</a>
        </div>

        <!-- Personal Content Grid (Glass Cards) -->
        <div id="personalContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="text-center py-16 text-gray-500 text-xs col-span-full border border-dashed border-white/10 rounded-3xl bg-[#141414]">
                Loading personal details...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-8 text-center px-4 mt-16 mb-16">
        <p class="text-xs text-gray-500">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        // Force premium dark aesthetic or handle toggle
        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '☀️';
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '🌙';
            }
        }

        async function loadPersonalData() {
            const container = document.getElementById('personalContainer');
            if (!container) return;
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let fetched = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.category === 'about_personal' && data.status !== 'unpublished') {
                        fetched.push({ id: doc.id, ...data });
                    }
                });
                fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (fetched.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 text-gray-500 text-xs col-span-full border border-dashed border-white/10 rounded-3xl bg-[#141414]">
                            No personal details added yet. Add them from your Admin Panel.
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                fetched.forEach(post => {
                    const label = post.titles?.en || '';
                    const val = post.descriptions?.en || '';
                    container.innerHTML += `
                        <div class="glass-card p-5 rounded-2xl transition-all duration-300">
                            ${label ? `<span class="text-red-500 text-[10px] uppercase font-black tracking-wider block mb-2">${label}</span>` : ''}
                            <p class="text-xs sm:text-sm font-medium text-gray-200 leading-relaxed whitespace-pre-line">${val}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading personal data:", err);
            }
        }

        loadPersonalData();
    </script>
</body>
    </html>
