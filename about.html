<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>About Me | SK TALIB</title>

<style>
:root{
  --bg:#090909;
  --surface:#111111;
  --surface2:#191919;
  --surface3:#211f1a;
  --gold:#c9a85b;
  --gold2:#a98a48;
  --text:#eee9df;
  --muted:#aaa397;
  --line:#3b3222;
  --shadow:rgba(0,0,0,.30);
}

body.light{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface2:#f0f3f7;
  --surface3:#e8edf4;
  --gold:#315d8a;
  --gold2:#547da8;
  --text:#202a36;
  --muted:#657181;
  --line:#d5deea;
  --shadow:rgba(35,55,80,.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  line-height:1.7;
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  color:inherit;
}

.container{
  width:min(100% - 32px,1000px);
  margin-inline:auto;
}

/* HEADER */

header{
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:20;
}

.header-inner{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.brand{
  text-decoration:none;
  line-height:1.15;
  flex-shrink:0;
}

.brand strong{
  display:block;
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:23px;
  font-weight:800;
  letter-spacing:2px;
}

.brand small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:9px;
  letter-spacing:2.2px;
}

/* HEADER CONTROLS */

.header-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
}

.control-btn{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--surface2);
  color:var(--text);
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px;
  transition:background .2s,border .2s;
}

.control-btn:hover{
  border-color:var(--gold);
}

.control-icon{
  color:var(--gold);
  font-size:15px;
}

/* LANGUAGE POPUP */

.language-wrap{
  position:relative;
}

.language-menu{
  display:none;
  position:absolute;
  top:46px;
  right:0;
  width:175px;
  padding:7px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
  box-shadow:0 12px 30px var(--shadow);
  z-index:100;
}

.language-menu.show{
  display:block;
}

.language-option{
  display:block;
  width:100%;
  padding:10px 11px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--text);
  text-align:left;
  font-family:Arial,sans-serif;
  font-size:13px;
  transition:background .2s,color .2s;
}

.language-option:hover,
.language-option.active{
  background:var(--surface2);
  color:var(--gold);
}

/* INTRODUCTION */

.masthead{
  padding:48px 18px 35px;
  text-align:center;
  border-bottom:1px solid var(--line);
}

.eyebrow{
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
}

.masthead h1{
  margin:12px 0 3px;
  color:var(--text);
  font-size:clamp(40px,8vw,68px);
  font-weight:700;
  letter-spacing:4px;
  line-height:1.2;
}

.masthead .nickname{
  color:var(--gold);
  font-size:17px;
  font-style:italic;
}

.masthead-description{
  max-width:560px;
  margin:14px auto 0;
  color:var(--muted);
  font-size:15px;
  line-height:1.9;
}

.gold-line{
  width:65px;
  height:2px;
  margin:22px auto 0;
  background:var(--gold);
}

/* MAIN CONTENT */

main{
  padding:30px 0 45px;
}

.section{
  margin-bottom:20px;
  padding:23px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  box-shadow:0 5px 20px var(--shadow);
  transition:background .25s,border .25s;
}

.section-heading{
  margin-bottom:19px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}

.section-heading h2{
  color:var(--gold);
  font-size:23px;
  font-weight:700;
  line-height:1.4;
}

.section-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* INFORMATION CARDS */

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.detail-item{
  min-width:0;
  padding:13px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--surface2);
}

.detail-label{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
}

.detail-value{
  color:var(--text);
  font-size:15px;
  font-weight:700;
  overflow-wrap:anywhere;
}

/* RELATIONSHIP CARD */

.relationship-card{
  padding:21px;
  border:1px solid var(--gold2);
  border-radius:8px;
  background:var(--surface2);
  text-align:center;
}

.relationship-title{
  color:var(--gold);
  font-size:22px;
  font-weight:700;
}

.relationship-tagline{
  margin-top:7px;
  color:var(--text);
  font-size:17px;
  font-style:italic;
}

.relationship-description{
  max-width:550px;
  margin:8px auto 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}

/* TEXT AND PERSONALITY */

.profile-text{
  color:var(--muted);
  font-size:15px;
  line-height:1.95;
}

.tag-list{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:15px;
}

.tag{
  padding:7px 12px;
  border:1px solid var(--line);
  border-radius:30px;
  background:var(--surface2);
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:12px;
}

/* PHILOSOPHY */

.quote-panel{
  padding:21px;
  border-left:3px solid var(--gold);
  border-radius:5px;
  background:var(--surface2);
  color:var(--text);
  font-size:17px;
  font-style:italic;
  line-height:1.9;
}

.quote-credit{
  margin-top:11px;
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:10px;
  font-style:normal;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* FOOTER */

.site-footer{
  padding:27px 12px 20px;
  border-top:1px solid var(--line);
  text-align:center;
}

.footer-brand{
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:20px;
  font-weight:800;
  letter-spacing:3px;
}

.footer-text{
  margin-top:7px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:11px;
}

.footer-copy{
  margin-top:12px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:10px;
}

/* BACK TO HOME */

.back-home{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:18px;
  padding:10px 18px;
  border:1px solid var(--gold2);
  border-radius:6px;
  background:var(--surface2);
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:700;
  text-decoration:none;
  transition:background .2s;
}

.back-home:hover{
  background:var(--surface3);
}

/* RESPONSIVE */

@media(max-width:600px){

  .container{
    width:min(100% - 22px,1000px);
  }

  .header-inner{
    min-height:70px;
    gap:7px;
  }

  .brand strong{
    font-size:18px;
    letter-spacing:1.5px;
  }

  .brand small{
    font-size:8px;
    letter-spacing:1.5px;
  }

  .header-actions{
    gap:5px;
  }

  .control-btn{
    min-height:35px;
    gap:5px;
    padding:6px 8px;
    font-size:10px;
  }

  .control-icon{
    font-size:13px;
  }

  .masthead{
    padding:35px 10px 27px;
  }

  .masthead h1{
    font-size:43px;
  }

  .masthead-description{
    font-size:13px;
  }

  main{
    padding-top:21px;
  }

  .section{
    padding:17px;
    margin-bottom:15px;
  }

  .section-heading h2{
    font-size:20px;
  }

  .detail-grid{
    gap:8px;
  }

  .detail-item{
    padding:10px;
  }

  .detail-value{
    font-size:13px;
  }

  .profile-text{
    font-size:14px;
  }
}

@media(max-width:360px){

  .brand strong{
    font-size:16px;
  }

  .brand small{
    font-size:7px;
  }

  .control-btn{
    padding:6px;
    font-size:9px;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }

}

// Language codes and page direction
const languageCodes = {
    en: "en",
    "hi-en": "en",
    ur: "ur",
    hi: "hi",
    or: "or"
};

function changeLanguage(language) {
    if (!translations[language]) return;

    const content = translations[language];

    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.getAttribute("data-i18n");

        if (Object.prototype.hasOwnProperty.call(content, key)) {
            element.textContent = content[key];
        }
    });

    document.documentElement.lang = languageCodes[language] || "en";
    document.documentElement.dir = language === "ur" ? "rtl" : "ltr";

    const languageNames = {
        en: "ENGLISH",
        "hi-en": "ROMAN HINDI",
        ur: "اردو",
        hi: "हिन्दी",
        or: "ଓଡ଼ିଆ"
    };

    const languageLabel = document.getElementById("languageLabel");
    if (languageLabel) {
        languageLabel.textContent = languageNames[language];
    }

    document.querySelectorAll(".language-option").forEach(option => {
        option.classList.toggle(
            "active",
            option.getAttribute("onclick")?.includes("'" + language + "'")
        );
    });

    try {
        localStorage.setItem("siteLanguage", language);
    } catch (error) {
        console.warn("Language preference could not be saved.");
    }

    closeLanguageMenu();
}

function toggleLanguageMenu() {
    const menu = document.getElementById("languageMenu");
    if (menu) menu.classList.toggle("show");
}

function closeLanguageMenu() {
    const menu = document.getElementById("languageMenu");
    if (menu) menu.classList.remove("show");
}

// Close language menu when clicking outside it
document.addEventListener("click", function(event) {
    const wrapper = document.querySelector(".language-wrap");

    if (wrapper && !wrapper.contains(event.target)) {
        closeLanguageMenu();
    }
});

// Dark and light theme
function updateThemeButton() {
    const isLight = document.body.classList.contains("light");
    const icon = document.getElementById("themeIcon");
    const label = document.getElementById("themeLabel");

    if (icon) icon.textContent = isLight ? "☾" : "☼";

    if (label) {
        const language = currentLanguage;
        label.textContent = isLight
            ? translations[language].lightMode
            : translations[language].darkMode;
    }
}

function toggleTheme() {
    document.body.classList.toggle("light");

    const isLight = document.body.classList.contains("light");

    try {
        localStorage.setItem("siteTheme", isLight ? "light" : "dark");
    } catch (error) {
        console.warn("Theme preference could not be saved.");
    }

    updateThemeButton();
}

// Age calculation
function calculateAge() {
    const birthDate = new Date(2005, 0, 29);
    const today = new Date();

    let age = today.getFullYear() - birthDate.getFullYear();

    const birthdayNotReached =
        today.getMonth() < birthDate.getMonth() ||
        (
            today.getMonth() === birthDate.getMonth() &&
            today.getDate() < birthDate.getDate()
        );

    if (birthdayNotReached) age--;

    const ageElement = document.getElementById("ageValue");

    if (ageElement) {
        ageElement.textContent = age;
    }
}

// Current language
let currentLanguage = "en";

// Load saved settings
document.addEventListener("DOMContentLoaded", function() {
    let savedLanguage = "en";
    let savedTheme = "dark";

    try {
        savedLanguage = localStorage.getItem("siteLanguage") || "en";
        savedTheme = localStorage.getItem("siteTheme") || "dark";
    } catch (error) {
        console.warn("Saved preferences could not be loaded.");
    }

    if (!translations[savedLanguage]) {
        savedLanguage = "en";
    }

    currentLanguage = savedLanguage;

    if (savedTheme === "light") {
        document.body.classList.add("light");
    } else {
        document.body.classList.remove("light");
    }

    changeLanguage(savedLanguage);
    updateThemeButton();
    calculateAge();

    const yearElement = document.getElementById("footerYear");

    if (yearElement) {
        yearElement.textContent = new Date().getFullYear();
    }
});

// Keep the current language updated
const originalChangeLanguage = changeLanguage;

changeLanguage = function(language) {
    if (!translations[language]) return;

    currentLanguage = language;
    originalChangeLanguage(language);
    updateThemeButton();
};
