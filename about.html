<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - SK TALIB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen pt-28 sm:pt-32 transition-colors duration-300 antialiased">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 sm:px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center shrink-0">
                <a href="index.html" class="text-base sm:text-xl font-bold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center space-x-1 text-xs font-semibold">
                <a href="index.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Home</a>
                <a href="about.html" class="text-red-600 dark:text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition">About</a>
                <a href="movie.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Movie</a>
                <a href="products.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Products</a>
                <a href="book.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Book</a>
                <a href="chat.html" class="text-gray-600 dark:text-gray-300 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition">Chat with AI</a>
            </nav>

            <!-- Right Controls -->
            <div class="flex items-center space-x-2.5 shrink-0">
                <div class="relative" id="langDropdownContainer">
                    <button type="button" onclick="toggleLangMenu()" class="flex items-center space-x-1.5 bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-800 rounded-xl px-2.5 py-1.5 text-xs font-medium hover:border-red-500 transition">
                        <span>🌐</span>
                        <span id="currentLangLabel">English</span>
                        <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="langMenu" class="hidden absolute right-0 mt-2 w-36 bg-white dark:bg-[#171717] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl overflow-hidden z-50">
                        <button type="button" onclick="selectLanguage('en', 'English')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#262626] transition flex items-center justify-between">
                            <span>English</span>
                            <span id="check_en" class="text-red-500 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectLanguage('roman_hi', 'Roman Hindi')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#262626] border-t border-gray-100 dark:border-gray-800 transition flex items-center justify-between">
                            <span>Roman Hindi</span>
                            <span id="check_roman_hi" class="text-red-500 font-bold hidden">✓</span>
                        </button>
                    </div>
                </div>

                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-8 h-8 rounded-xl bg-gray-100 dark:bg-[#171717] border border-gray-200 dark:border-gray-800 hover:bg-gray-200 dark:hover:bg-[#262626] transition" title="Toggle Theme">
                    <span id="modeIcon" class="text-xs">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Horizontal Nav Bar -->
    <div class="fixed top-[57px] left-0 w-full z-40 flex lg:hidden overflow-x-auto no-scrollbar space-x-4 px-4 py-2.5 bg-white/95 dark:bg-[#0f0f0f]/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="text-gray-600 dark:text-gray-400">Home</a>
        <a href="about.html" class="text-red-600 dark:text-red-500">About</a>
        <a href="movie.html" class="text-gray-600 dark:text-gray-400">Movie</a>
        <a href="products.html" class="text-gray-600 dark:text-gray-400">Products</a>
        <a href="book.html" class="text-gray-600 dark:text-gray-400">Book</a>
        <a href="chat.html" class="text-gray-600 dark:text-gray-400">Chat with AI</a>
    </div>

    <!-- Main About Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 space-y-6">
        
        <!-- Header Title -->
        <div class="text-center">
            <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">SK TALIB</h2>
            <p class="text-xs text-red-600 dark:text-red-400 font-semibold mt-1">About & Personal Space</p>
        </div>

        <!-- 6 Category Navigation Tabs -->
        <div class="flex overflow-x-auto no-scrollbar space-x-2 pb-2 border-b border-gray-200 dark:border-gray-800 justify-start sm:justify-center">
            <button onclick="selectAboutTab('personal')" id="atab_personal" class="px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white transition whitespace-nowrap">Personal</button>
            <button onclick="selectAboutTab('education')" id="atab_education" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Education</button>
            <button onclick="selectAboutTab('gallery')" id="atab_gallery" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Gallery</button>
            <button onclick="selectAboutTab('feelings')" id="atab_feelings" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Feeling Moment</button>
            <button onclick="selectAboutTab('social')" id="atab_social" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Social Media</button>
            <button onclick="selectAboutTab('contact')" id="atab_contact" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap">Contact</button>
        </div>

        <!-- Tab Content Area -->
        <div id="aboutTabContent" class="min-h-[250px]">
            <div class="text-center py-12 text-gray-500 text-xs border border-dashed border-gray-300 dark:border-gray-800 rounded-3xl bg-gray-50/50 dark:bg-[#171717]/50">
                Loading details...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-8 text-center px-4 mt-12 mb-16">
        <p class="text-xs text-gray-500 dark:text-gray-400">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = localStorage.getItem('site_lang') || 'en';
        let currentAboutTab = 'personal';
        let allAboutPosts = [];

        window.toggleLangMenu = function() {
            const menu = document.getElementById('langMenu');
            if (menu) menu.classList.toggle('hidden');
        }

        window.selectLanguage = function(lang, label) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            const lbl = document.getElementById('currentLangLabel');
            if (lbl) lbl.innerText = label;
            const ce = document.getElementById('check_en');
            const cr = document.getElementById('check_roman_hi');
            if (ce) ce.classList.toggle('hidden', lang !== 'en');
            if (cr) cr.classList.toggle('hidden', lang !== 'roman_hi');
            const menu = document.getElementById('langMenu');
            if (menu) menu.classList.add('hidden');
            renderAboutTab();
        }

        document.addEventListener('click', function(e) {
            const container = document.getElementById('langDropdownContainer');
            const menu = document.getElementById('langMenu');
            if (container && menu && !container.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            if (modeIcon) modeIcon.innerText = '☀️';
        } else {
            html.classList.add('dark');
            if (modeIcon) modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                if (modeIcon) modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                if (modeIcon) modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.selectAboutTab = function(tabName) {
            currentAboutTab = tabName;
            ['personal', 'education', 'gallery', 'feelings', 'social', 'contact'].forEach(t => {
                const btn = document.getElementById(`atab_${t}`);
                if (btn) {
                    if (t === tabName) {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white transition whitespace-nowrap";
                    } else {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 dark:bg-[#171717] text-gray-700 dark:text-gray-300 transition whitespace-nowrap";
                    }
                }
            });
            renderAboutTab();
        }

        function renderAboutTab() {
            const container = document.getElementById('aboutTabContent');
            if (!container) return;

            const filtered = allAboutPosts.filter(p => p.category === `about_${currentAboutTab}`);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500 text-xs border border-dashed border-gray-300 dark:border-gray-800 rounded-3xl bg-gray-50/50 dark:bg-[#171717]/50">
                        Nothing added in <span class="font-bold uppercase">${currentAboutTab}</span> yet. Add details from your Admin Panel.
                    </div>
                `;
                return;
            }

            if (currentAboutTab === 'gallery') {
                let gridHtml = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-4">`;
                filtered.forEach(post => {
                    const title = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : (post.titles?.en || '');
                    if (post.media) {
                        gridHtml += `
                            <div class="bg-gray-50 dark:bg-[#171717] p-2.5 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm">
                                <img src="${post.media}" class="w-full h-48 sm:h-56 object-cover rounded-xl" loading="lazy">
                                ${title ? `<p class="text-xs font-semibold text-gray-800 dark:text-gray-200 mt-2 px-1 truncate">${title}</p>` : ''}
                            </div>
                        `;
                    }
                });
                gridHtml += `</div>`;
                container.innerHTML = gridHtml;
                return;
            }

            if (currentAboutTab === 'personal' || currentAboutTab === 'education') {
                let cardsHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">`;
                filtered.forEach(post => {
                    const label = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : (post.titles?.en || '');
                    const val = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : (post.descriptions?.en || '');
                    cardsHtml += `
                        <div class="bg-gray-50 dark:bg-[#171717] p-4 rounded-2xl border border-gray-200 dark:border-gray-800">
                            ${label ? `<span class="text-gray-400 text-[10px] uppercase font-bold block mb-1">${label}</span>` : ''}
                            <p class="text-xs sm:text-sm font-semibold text-gray-900 dark:text-gray-100 leading-relaxed whitespace-pre-line">${val}</p>
                        </div>
                    `;
                });
                cardsHtml += `</div>`;
                container.innerHTML = cardsHtml;
                return;
            }

            if (currentAboutTab === 'social' || currentAboutTab === 'contact') {
                let linksHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">`;
                filtered.forEach(post => {
                    const platformName = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : (post.titles?.en || 'Link');
                    const handleText = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : (post.descriptions?.en || '');
                    const url = post.redirectLink || '#';
                    linksHtml += `
                        <a href="${url}" target="_blank" class="bg-gray-50 dark:bg-[#171717] hover:border-red-500 p-4 rounded-2xl border border-gray-200 dark:border-gray-800 flex items-center justify-between transition group">
                            <div class="flex items-center space-x-3">
                                ${post.media ? `<img src="${post.media}" class="w-10 h-10 object-cover rounded-xl">` : `<div class="w-10 h-10 rounded-xl bg-red-600/10 text-red-600 flex items-center justify-center font-bold text-sm">🔗</div>`}
                                <div>
                                    <h4 class="text-xs sm:text-sm font-bold text-gray-900 dark:text-white group-hover:text-red-500 transition">${platformName}</h4>
                                    ${handleText ? `<p class="text-[11px] text-gray-500 dark:text-gray-400">${handleText}</p>` : ''}
                                </div>
                            </div>
                            <span class="text-xs text-gray-400 group-hover:text-red-500">↗</span>
                        </a>
                    `;
                });
                linksHtml += `</div>`;
                container.innerHTML = linksHtml;
                return;
            }

            // Feelings / Moments
            let momentsHtml = `<div class="space-y-5">`;
            filtered.forEach(post => {
                const title = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : (post.titles?.en || '');
                const desc = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : (post.descriptions?.en || '');
                momentsHtml += `
                    <div class="bg-gray-50 dark:bg-[#171717] p-5 sm:p-6 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] text-gray-400 font-medium">${post.dateFormatted || ''}</span>
                        </div>
                        ${title ? `<h3 class="text-sm sm:text-base font-bold text-gray-900 dark:text-white mb-3">${title}</h3>` : ''}
                        ${post.media ? `<img src="${post.media}" class="w-full max-h-96 object-cover rounded-2xl mb-3 border border-gray-200 dark:border-gray-800" loading="lazy">` : ''}
                        ${desc ? `<p class="text-xs sm:text-sm text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-line">${desc}</p>` : ''}
                    </div>
                `;
            });
            momentsHtml += `</div>`;
            container.innerHTML = momentsHtml;
        }

        async function loadAllAboutData() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let fetched = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.category && data.category.startsWith('about_') && data.status !== 'unpublished') {
                        fetched.push({ id: doc.id, ...data });
                    }
                });
                fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                allAboutPosts = fetched;
                renderAboutTab();
            } catch (err) {
                console.error("Load error:", err);
            }
        }

        loadAllAboutData();
    </script>
</body>
    </html>
