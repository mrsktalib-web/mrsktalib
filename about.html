<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK TALIB - Home Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0b0b; color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 22, 0.8) 0%, rgba(12, 12, 12, 0.95) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
        }
        .glass-card:hover {
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 10px 30px 0 rgba(239, 68, 68, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pt-28 sm:pt-32 antialiased selection:bg-red-600 selection:text-white">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-[#0b0b0b]/85 backdrop-blur-2xl border-b border-white/10 px-4 sm:px-6 py-3.5 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center shrink-0">
                <a href="index.html" class="text-base sm:text-xl font-extrabold tracking-wider text-red-600 whitespace-nowrap">SK <span class="text-white">TALIB</span></a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center space-x-1 text-xs font-semibold">
                <a href="index.html" class="text-red-500 bg-red-500/10 border border-red-500/20 px-3.5 py-2 rounded-xl transition">Home</a>
                <a href="about.html" class="text-gray-400 hover:text-white px-3.5 py-2 rounded-xl transition">About</a>
                <a href="movie.html" class="text-gray-400 hover:text-white px-3.5 py-2 rounded-xl transition">Movie</a>
                <a href="products.html" class="text-gray-400 hover:text-white px-3.5 py-2 rounded-xl transition">Products</a>
                <a href="book.html" class="text-gray-400 hover:text-white px-3.5 py-2 rounded-xl transition">Book</a>
                <a href="chat.html" class="text-gray-400 hover:text-white px-3.5 py-2 rounded-xl transition">Chat with AI</a>
            </nav>

            <!-- Language Switcher Option -->
            <div class="flex items-center space-x-2 shrink-0">
                <div class="relative" id="langDropdownContainer">
                    <button type="button" onclick="toggleLangMenu()" class="flex items-center space-x-1.5 bg-[#171717] text-gray-300 border border-white/10 rounded-xl px-3 py-2 text-xs font-medium hover:border-red-500/50 transition">
                        <span>Language:</span>
                        <span id="currentLangLabel" class="font-bold text-white">English</span>
                    </button>
                    <div id="langMenu" class="hidden absolute right-0 mt-2 w-36 bg-[#171717] border border-white/10 rounded-xl shadow-2xl overflow-hidden z-50">
                        <button type="button" onclick="selectLanguage('en', 'English')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-300 hover:bg-white/5 transition flex items-center justify-between">
                            <span>English</span>
                            <span id="check_en" class="text-red-500 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectLanguage('roman_hi', 'Roman Hindi')" class="w-full text-left px-3.5 py-2.5 text-xs font-medium text-gray-300 hover:bg-white/5 border-t border-white/5 transition flex items-center justify-between">
                            <span>Roman Hindi</span>
                            <span id="check_roman_hi" class="text-red-500 font-bold hidden">✓</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Horizontal Nav Bar -->
    <div class="fixed top-[57px] left-0 w-full z-40 flex lg:hidden overflow-x-auto no-scrollbar space-x-2 px-4 py-3 bg-[#0b0b0b]/90 backdrop-blur-xl border-b border-white/10 text-xs font-semibold whitespace-nowrap">
        <a href="index.html" class="px-3.5 py-2 rounded-xl bg-red-600 text-white shadow-lg shadow-red-600/30">Home</a>
        <a href="about.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">About</a>
        <a href="movie.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Movie</a>
        <a href="products.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Products</a>
        <a href="book.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Book</a>
        <a href="chat.html" class="px-3.5 py-2 rounded-xl bg-[#171717] text-gray-400 border border-white/5">Chat with AI</a>
    </div>

    <!-- Main Home Feed Container -->
    <main class="max-w-2xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-extrabold tracking-tight text-white">Latest Feed</h2>
            <span class="h-2 w-2 rounded-full bg-red-600 animate-ping"></span>
        </div>
        <div id="homeFeedContainer" class="space-y-5">
            <div class="text-center py-16 text-gray-500 text-xs border border-dashed border-white/10 rounded-3xl bg-[#141414]">
                Loading feed...
            </div>
        </div>
    </main>

    <!-- Floating Admin Button (+) -->
    <button onclick="openAdminModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-red-600 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl font-black hover:bg-red-700 hover:scale-105 transition duration-300 z-50 shadow-red-600/50">+</button>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-card p-7 rounded-3xl w-full max-w-sm shadow-2xl border border-white/10">
            <h3 class="text-base font-bold mb-3 text-white">Admin Access</h3>
            <input type="password" id="adminPassInput" placeholder="Enter Admin Password" class="w-full p-3.5 bg-[#0b0b0b] border border-white/10 rounded-2xl text-xs mb-4 text-white focus:outline-none focus:border-red-500">
            <div class="flex space-x-2.5">
                <button onclick="verifyAdmin()" class="flex-1 bg-red-600 text-white py-3 rounded-xl text-xs font-bold hover:bg-red-700 transition shadow-lg shadow-red-600/30">Login</button>
                <button onclick="closeAdminModal()" class="flex-1 bg-[#222] text-gray-300 py-3 rounded-xl text-xs font-bold hover:bg-[#333] transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-8 text-center px-4 mt-16 mb-16">
        <p class="text-xs text-gray-500">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = localStorage.getItem('site_lang') || 'en';

        window.toggleLangMenu = function() {
            document.getElementById('langMenu').classList.toggle('hidden');
        }

        window.selectLanguage = function(lang, label) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            document.getElementById('currentLangLabel').innerText = label;
            document.getElementById('check_en').classList.toggle('hidden', lang !== 'en');
            document.getElementById('check_roman_hi').classList.toggle('hidden', lang !== 'roman_hi');
            document.getElementById('langMenu').classList.add('hidden');
            loadHomeFeed();
        }

        document.addEventListener('click', function(e) {
            const container = document.getElementById('langDropdownContainer');
            if (container && !container.contains(e.target)) {
                document.getElementById('langMenu').classList.add('hidden');
            }
        });

        window.openAdminModal = function() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        window.closeAdminModal = function() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        window.verifyAdmin = function() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'SKTALIB@9037') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Incorrect Password!');
            }
        }

        async function loadHomeFeed() {
            const container = document.getElementById('homeFeedContainer');
            if (!container) return;
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let posts = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.category === 'home' && data.status !== 'unpublished') {
                        posts.push({ id: doc.id, ...data });
                    }
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (posts.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-500 text-center py-12">No posts in Home feed yet.</p>`;
                    return;
                }

                container.innerHTML = "";
                posts.forEach(post => {
                    const title = (post.titles && post.titles[currentLang]) ? post.titles[currentLang] : (post.titles?.en || '');
                    const desc = (post.descriptions && post.descriptions[currentLang]) ? post.descriptions[currentLang] : (post.descriptions?.en || '');
                    
                    let mediaHtml = "";
                    if (post.mediaType === 'video_link' && post.media) {
                        mediaHtml = `<div class="aspect-video w-full mb-3.5"><iframe src="${post.media}" class="w-full h-full rounded-2xl border border-white/10" allowfullscreen></iframe></div>`;
                    } else if (post.media) {
                        mediaHtml = `<img src="${post.media}" class="w-full max-h-[480px] object-cover rounded-2xl mb-3.5 border border-white/10" loading="lazy">`;
                    }

                    container.innerHTML += `
                        <div class="glass-card p-5 sm:p-6 rounded-3xl transition-all duration-300">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-[10px] text-red-500 font-bold uppercase tracking-wider">${post.dateFormatted || ''}</span>
                            </div>
                            ${title ? `<h3 class="text-sm sm:text-base font-bold text-white mb-2.5">${title}</h3>` : ''}
                            ${mediaHtml}
                            ${desc ? `<p class="text-xs sm:text-sm text-gray-300 leading-relaxed whitespace-pre-line">${desc}</p>` : ''}
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Home feed error:", err);
            }
        }

        loadHomeFeed();
    </script>
</body>
                    </html>
