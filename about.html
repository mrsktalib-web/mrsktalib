<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - SK TALIB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 22, 0.9) 0%, rgba(12, 12, 12, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.7);
        }
        html:not(.dark) .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 245, 247, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.08);
        }

        .premium-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.08) 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 4px 20px 0 rgba(212, 175, 55, 0.2);
        }
        .premium-btn:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(212, 175, 55, 0.15) 100%);
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 4px 25px 0 rgba(212, 175, 55, 0.35);
        }
    </style>
</head>
<body class="bg-[#f4f4f6] dark:bg-[#080808] text-gray-900 dark:text-gray-100 min-h-screen pt-40 lg:pt-28 transition-colors duration-300 antialiased">
    
    <!-- Fixed Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 dark:bg-[#0b0b0b]/90 backdrop-blur-2xl border-b border-gray-200 dark:border-amber-500/20 px-4 sm:px-6 py-3.5 shadow-md dark:shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center shrink-0">
                <a href="index.html" class="text-base sm:text-xl font-black tracking-wider text-amber-600 dark:text-amber-500 whitespace-nowrap">SK <span class="text-gray-900 dark:text-white">TALIB</span></a>
            </div>

            <nav class="hidden lg:flex items-center space-x-1.5 text-xs font-bold tracking-wide">
                <a href="index.html" class="text-gray-700 dark:text-gray-300 hover:text-amber-600 dark:hover:text-amber-500 px-4 py-2 rounded-xl transition">Home</a>
                <a href="about.html" class="text-amber-700 dark:text-amber-500 bg-amber-500/15 border border-amber-500/50 px-4 py-2 rounded-xl transition">About</a>
                <a href="movie.html" class="text-gray-700 dark:text-gray-300 hover:text-amber-600 dark:hover:text-amber-500 px-4 py-2 rounded-xl transition">Movie</a>
                <a href="products.html" class="text-gray-700 dark:text-gray-300 hover:text-amber-600 dark:hover:text-amber-500 px-4 py-2 rounded-xl transition">Products</a>
                <a href="book.html" class="text-gray-700 dark:text-gray-300 hover:text-amber-600 dark:hover:text-amber-500 px-4 py-2 rounded-xl transition">Book</a>
                <a href="gallery.html" class="text-gray-700 dark:text-gray-300 hover:text-amber-600 dark:hover:text-amber-500 px-4 py-2 rounded-xl transition">Gallery</a>
            </nav>

            <div class="flex items-center space-x-2.5 shrink-0">
                <a href="chat.html" class="premium-btn flex items-center space-x-2 text-amber-700 dark:text-amber-400 px-3.5 py-2 rounded-xl text-xs font-bold tracking-wide transition">
                    <span>Chat with AI</span>
                    <svg class="w-3.5 h-3.5 text-amber-600 dark:text-amber-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </a>
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="flex items-center justify-center w-10 h-10 rounded-xl bg-gray-200 dark:bg-[#171717] border border-gray-300 dark:border-amber-500/30 hover:border-amber-500/70 transition text-sm shrink-0 shadow-sm">
                    <span id="modeIcon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Grid Nav Bar -->
    <div class="fixed top-[65px] left-0 w-full z-40 grid grid-cols-3 gap-2 lg:hidden px-3 py-3 bg-white/95 dark:bg-[#0b0b0b]/95 backdrop-blur-xl border-b border-gray-200 dark:border-amber-500/20 text-xs font-bold text-center tracking-wide">
        <a href="index.html" class="py-2 px-2 rounded-xl bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-white/10 shadow-sm">Home</a>
        <a href="about.html" class="py-2 px-2 rounded-xl bg-amber-500 text-gray-950 font-black shadow-md shadow-amber-500/30">About</a>
        <a href="movie.html" class="py-2 px-2 rounded-xl bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-white/10 shadow-sm">Movie</a>
        <a href="products.html" class="py-2 px-2 rounded-xl bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-white/10 shadow-sm">Products</a>
        <a href="book.html" class="py-2 px-2 rounded-xl bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-white/10 shadow-sm">Book</a>
        <a href="gallery.html" class="py-2 px-2 rounded-xl bg-gray-100 dark:bg-[#171717] text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-white/10 shadow-sm">Gallery</a>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        
        <div class="text-center space-y-1">
            <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-gray-900 dark:text-white">About Me</h2>
            <p class="text-xs text-amber-600 dark:text-amber-500 font-bold uppercase tracking-widest">Personal Space & Background</p>
        </div>

        <!-- Category Selection Tabs (Managed from Admin Panel) -->
        <div class="flex overflow-x-auto no-scrollbar space-x-2 pb-2 border-b border-gray-200 dark:border-amber-500/20">
            <button onclick="switchCategory('about_personal')" id="tab_personal" class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-gray-950 transition shrink-0 shadow-md">Personal</button>
            <button onclick="switchCategory('about_education')" id="tab_education" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-200 dark:bg-[#171717] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-white/10 transition shrink-0">Education</button>
            <button onclick="switchCategory('about_gallery')" id="tab_gallery" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-200 dark:bg-[#171717] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-white/10 transition shrink-0">Gallery</button>
            <button onclick="switchCategory('about_feelings')" id="tab_feelings" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-200 dark:bg-[#171717] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-white/10 transition shrink-0">Feelings</button>
            <button onclick="switchCategory('about_social')" id="tab_social" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-200 dark:bg-[#171717] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-white/10 transition shrink-0">Social</button>
            <button onclick="switchCategory('about_contact')" id="tab_contact" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-200 dark:bg-[#171717] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-white/10 transition shrink-0">Contact</button>
        </div>

        <!-- Dynamic Content Display Grid -->
        <div id="aboutContentContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="text-center py-16 text-gray-500 text-xs col-span-full border border-dashed border-gray-300 dark:border-amber-500/20 rounded-3xl bg-white dark:bg-[#141414]">
                Loading details...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-amber-500/20 py-8 text-center px-4 mt-16 mb-16">
        <p class="text-xs text-gray-500">&copy; 2026 SK TALIB. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { projectId: "mrsktalib-4ab8e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const html = document.documentElement;
        const modeIcon = document.getElementById('modeIcon');

        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            modeIcon.innerText = '☀️';
        } else {
            html.classList.add('dark');
            modeIcon.innerText = '🌙';
        }

        window.toggleDarkMode = function() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        let allAboutPosts = [];
        let currentTab = 'about_personal';

        window.switchCategory = function(category) {
            currentTab = category;
            ['about_personal', 'about_education', 'about_gallery', 'about_feelings', 'about_social', 'about_contact'].forEach(cat => {
                const btn = document.getElementById(`tab_${cat.replace('about_', '')}`);
                if (btn) {
                    if (cat === category) {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-gray-950 transition shrink-0 shadow-md";
                    } else {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-gray-200 dark:bg-[#171717] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-white/10 transition shrink-0";
                    }
                }
            });
            renderAboutContent();
        }

        function renderAboutContent() {
            const container = document.getElementById('aboutContentContainer');
            const filtered = allAboutPosts.filter(p => p.category === currentTab);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 text-gray-500 text-xs sm:text-sm col-span-full border border-dashed border-gray-300 dark:border-amber-500/20 rounded-3xl bg-white dark:bg-[#141414] shadow-sm">
                        No items found in this section yet. Add them from your Admin Panel.
                    </div>
                `;
                return;
            }

            container.innerHTML = "";
            filtered.forEach(post => {
                const title = post.titles?.en || '';
                const desc = post.descriptions?.en || '';
                const link = post.redirectLink || '#';

                let cardBody = '';

                if (currentTab === 'about_social' || currentTab === 'about_contact') {
                    cardBody = `
                        <a href="${link}" target="_blank" class="glass-card p-5 rounded-2xl flex items-center space-x-4 transition-all duration-300 block group hover:scale-[1.02]">
                            ${post.media ? `<img src="${post.media}" class="w-14 h-14 object-cover rounded-xl border border-amber-500/30 shrink-0">` : '<div class="w-14 h-14 bg-amber-500/10 rounded-xl flex items-center justify-center text-amber-500 font-bold shrink-0">🔗</div>'}
                            <div class="overflow-hidden">
                                <h4 class="text-sm font-bold text-gray-900 dark:text-white group-hover:text-amber-500 transition truncate">${title}</h4>
                                <p class="text-xs text-gray-600 dark:text-gray-400 truncate mt-0.5">${desc}</p>
                            </div>
                        </a>
                    `;
                    container.innerHTML += cardBody;
                } else if (currentTab === 'about_gallery' || currentTab === 'about_feelings') {
                    cardBody = `
                        <div class="glass-card p-5 rounded-3xl space-y-3">
                            ${post.media ? `<img src="${post.media}" class="w-full h-64 object-cover rounded-2xl border border-amber-500/20" loading="lazy">` : ''}
                            ${title ? `<h4 class="text-sm font-bold text-gray-900 dark:text-white">${title}</h4>` : ''}
                            ${desc ? `<p class="text-xs sm:text-sm text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-line">${desc}</p>` : ''}
                        </div>
                    `;
                    container.innerHTML += `<div class="col-span-full">${cardBody}</div>`;
                } else {
                    // Personal & Education
                    cardBody = `
                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            ${title ? `<span class="text-amber-600 dark:text-amber-500 text-[11px] uppercase font-black tracking-wider block">${title}</span>` : ''}
                            ${desc ? `<p class="text-xs sm:text-sm font-medium text-gray-800 dark:text-gray-200 leading-relaxed whitespace-pre-line">${desc}</p>` : ''}
                        </div>
                    `;
                    container.innerHTML += cardBody;
                }
            });
        }

        async function loadAboutData() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                let fetched = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.category && data.category.startsWith('about_') && data.status !== 'unpublished') {
                        fetched.push({ id: doc.id, ...data });
                    }
                });
                fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                allAboutPosts = fetched;
                renderAboutContent();
            } catch (err) {
                console.error("Error loading about data:", err);
            }
        }

        loadAboutData();
    </script>
</body>
</html>
